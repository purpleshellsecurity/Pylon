# Table -> candidate ATT&CK techniques. The REVERSE of the generation direction.
#
# Generation goes service -> tables -> techniques. The gap scan needs the other
# way round: given the tables that actually have data, which techniques are even
# detectable here. Nothing in this repo answered that, so this file does.
#
# WHAT THIS IS: curated detection-engineering judgment, not a harvested source.
# Every other catalog under catalog/ is pulled from a Microsoft doc or the ATT&CK
# STIX bundle. This one is hand-authored, so it is held to three rules instead:
#
#   1. Every `id` must exist in attacks/mitre-attack.yaml (enforced by
#      tests/test_table_techniques.py — a typo'd or invented ID fails the suite).
#   2. Every entry carries a `basis`: the concrete telemetry that evidences it.
#      No basis, no entry.
#   3. `primary`, where present, is the REASON this table is the technique's
#      primary home — not a label. There is no `primary: true`: the field's value
#      IS the argument, so the fact cannot be asserted without being made. At most
#      one table per technique may carry it, and it is set only where it decides
#      something. It exists because the table tie-break ranks an operation-scoped
#      claim above a table-scoped one, and that reads as "more central to this
#      technique" when it means only "the index knows the literals this log
#      writes" — which put AZKVAuditLogs ahead of SigninLogs for T1078.004 on a
#      real tenant. Absent is the default and carries no claim either way.
#   4. `operations` is a *precision* aid, never a gate. Listed operation literals
#      let a deployed rule be matched to a technique at operation resolution.
#      An empty list means the table has no operation vocabulary that separates
#      techniques (SigninLogs has no OperationName; AKSAudit's vocabulary is bare
#      verbs like `get`/`create` that say nothing about the resource kind), so
#      rules on it can only ever be matched at TABLE resolution. That is a real
#      limit of the data and the gap report says so rather than papering over it.
#   5. `rejected`, where present, makes the entry a COMPLETE PARTITION of the
#      table's operation vocabulary: every operation the table can log is either
#      mapped to a technique above or listed under `rejected` with the reason it
#      is not. It exists because "not in the file" and "looked at it and decided
#      no" read identically otherwise, and the first is a harvesting bug while
#      the second is a judgment. Only tables whose full vocabulary is harvested
#      can carry it; tests/test_table_techniques.py holds those tables to the
#      partition and fails when a newly harvested operation lands in neither
#      half.
#
# A table absent from this file is not "supports nothing" — it is "we do not
# know what it supports", and the gap report counts and names those tables
# separately so the denominator is never silently understated.
#
# platform: the ATT&CK platform the table's telemetry belongs to. Informational;
# the technique's own platforms come from the ATT&CK catalog.
version: 1
source: "hand-authored (Pylon detection-engineering judgment); IDs validated against attacks/mitre-attack.yaml"

tables:

  # ── Control plane (ARM) ─────────────────────────────────────────────────────
  AzureActivity:
    platform: IaaS
    plane: control
    note: >-
      Write-side only. ARM read/list operations are NOT recorded in AzureActivity,
      so discovery techniques that depend on seeing reads (T1580, T1526) are
      deliberately absent from this entry even though they are IaaS techniques.
    techniques:
      - id: T1098.003
        operations: [MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE]
        basis: RBAC role assignment writes are the ARM record of granting a principal a new role.
      - id: T1531
        operations: [MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/DELETE]
        basis: >-
          Removing a role assignment takes access away. Separated from the grant
          rather than paired with it, because they are different acts: one is an
          attacker gaining reach, the other is a defender losing it, or an
          attacker locking responders out mid-incident.
      - id: T1562.008
        operations:
          - MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE
          - MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/SERVICES/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/FILESERVICES/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/QUEUESERVICES/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/TABLESERVICES/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/ELASTICPOOLS/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.WEB/SITES/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
        basis: >-
          Diagnostic-setting delete/modify is how cloud logging is turned off in
          Azure. The NSG-scoped one is listed separately because Azure emits it
          under the NSG's own resource type rather than under Microsoft.Insights,
          so a filter on the provider alone misses it.
      - id: T1562.007
        operations:
          - MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/WRITE
          - MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/DELETE
          - MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/WRITE
          - MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/DELETE
          - MICROSOFT.NETWORK/AZUREFIREWALLS/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/PRIVATEENDPOINTCONNECTIONSAPPROVAL/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/SETACL/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/QUEUESERVICES/QUEUES/SETACL/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/TABLESERVICES/TABLES/SETACL/ACTION
        basis: >-
          NSG rule and firewall writes are the cloud-firewall modification surface.
          The group-level write and delete are here as well as the rule-level ones:
          deleting a security group removes every rule in it at once, and a
          detection watching only securityRules/delete would not see that.
      - id: T1578.001
        operations:
          - MICROSOFT.COMPUTE/SNAPSHOTS/WRITE
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/CAPTURE/ACTION
        basis: >-
          Disk snapshot creation, the standard precursor to offline disk inspection.
          Capture is the same act by another name: it copies the VM's virtual hard
          disks into an image, and the copy can then be mounted anywhere.
      - id: T1578.002
        operations: [MICROSOFT.COMPUTE/VIRTUALMACHINES/WRITE]
        basis: VM create/update writes.
      - id: T1578
        operations: [MICROSOFT.COMPUTE/VIRTUALMACHINES/ATTACHDETACHDATADISKS/ACTION]
        basis: >-
          Attaching a data disk to a VM the attacker controls is the read half of
          the snapshot pattern: the snapshot makes a copy, this mounts one. The
          parent technique rather than Create Snapshot, because no snapshot is
          created here -- an existing disk simply changes machine.
      - id: T1578.003
        operations: [MICROSOFT.COMPUTE/VIRTUALMACHINES/DELETE]
        basis: VM deletion.
      - id: T1578.004
        operations:
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/REIMAGE/ACTION
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/ROLLBACKOSDISK/ACTION
        basis: >-
          Reverting a VM to its base image or rolling back its OS disk destroys
          everything written since, including whatever an incident responder was
          about to collect. Reads as recovery and works as evidence destruction.
      - id: T1651
        operations:
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMANDS/WRITE
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/DIAGNOSTICRUNCOMMAND/ACTION
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/DIAGNOSTICRUNCOMMANDS/WRITE
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE
          - MICROSOFT.RESOURCES/SUBSCRIPTIONS/RESOURCEGROUPS/DEPLOYMENTS/WRITE
        basis: >-
          RunCommand and extension writes execute attacker code on a VM through the
          control plane. A template deployment is the same shape at subscription
          level: it runs an attacker-supplied definition, creates resources, and is
          the other half of vaults/deploy/action -- a deployment is how secrets
          leave a vault without one data-plane read.

          The noisiest entry in this table by a wide margin. Any tenant running
          infrastructure-as-code deploys constantly, so this is worth watching only
          alongside something else, most obviously a vault release in the same
          deployment.
      - id: T1485
        operations:
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/DELETEPRESERVEDOSDISK/ACTION
          - MICROSOFT.RESOURCES/SUBSCRIPTIONS/RESOURCEGROUPS/DELETE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/DELETE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/DELETE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/FILESERVICES/SHARES/DELETE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/QUEUESERVICES/QUEUES/DELETE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/TABLESERVICES/TABLES/DELETE
        basis: Destructive ARM deletes of data-bearing resources. Key Vault and
          SQL are absent on purpose -- their own sections below carry the same two
          deletes with what is recoverable and what is not, and one operation is
          judged once.
      - id: T1490
        operations:
          - MICROSOFT.RECOVERYSERVICES/VAULTS/DELETE
          - MICROSOFT.RECOVERYSERVICES/VAULTS/BACKUPPOLICIES/DELETE
        basis: Recovery Services vault / backup policy deletion removes the ability to restore.
      - id: T1666
        operations:
          - MICROSOFT.MANAGEMENT/MANAGEMENTGROUPS/SUBSCRIPTIONS/WRITE
          - MICROSOFT.RESOURCES/SUBSCRIPTIONS/RESOURCEGROUPS/MOVERESOURCES/ACTION
        basis: >-
          Moving a subscription between management groups changes what policy and
          RBAC apply to it. Moving resources between resource groups does the same
          thing one level down: inherited role assignments, locks and policy are
          all scoped to the group a resource sits in.
      # ── Storage, control plane ─────────────────────────────────────────────
      - id: T1552
        operations:
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTKEYS/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/LOCALUSERS/LISTKEYS/ACTION
        basis: >-
          Listing a storage account's access keys hands over every byte in it and
          bypasses RBAC entirely -- the key IS the authorisation. The single most
          valuable ARM operation against storage, and the one most likely to be
          issued by a legitimate application at the same time, which is what makes
          it hard rather than unimportant.

          "Every byte in it" is not a figure of speech. If the account backs a
          function app, those bytes include the app's access keys, and the master
          key among them carries the ability to deploy and run code. A read on this
          operation can therefore end in code execution on a resource the caller
          holds no permission on at all.
      - id: T1098.001
        operations:
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTACCOUNTSAS/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTSERVICESAS/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/GENERATEUSERDELEGATIONKEY/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/FILESERVICES/GENERATEUSERDELEGATIONKEY/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/QUEUESERVICES/GENERATEUSERDELEGATIONKEY/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/TABLESERVICES/GENERATEUSERDELEGATIONKEY/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/REGENERATEKEY/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/ROTATEKEY/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/LOCALUSERS/REGENERATESHAREDKEY/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/LOCALUSERS/REGENERATEPASSWORD/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/LOCALUSERS/WRITE
        basis: >-
          Minting new credentials for the account rather than reading existing
          ones. A SAS token or delegation key is a bearer credential that survives
          the session it was made in, and an SFTP local user is a standing account
          with its own password. Key regeneration is here as well: it is normal
          hygiene, and it is also how an attacker who already has a key locks the
          owner out of rotating them away.
      - id: T1537
        operations:
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/OBJECTREPLICATIONPOLICIES/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/DATASHARES/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/DATASHAREPOLICIES/WRITE
        basis: >-
          Object replication and data shares copy blobs continuously into ANOTHER
          storage account. Configure it once and exfiltration runs by itself, with
          no further access to the source and nothing in the data-plane log that
          looks like a bulk read.
      - id: T1490
        operations:
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/CLEARLEGALHOLD/ACTION
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/IMMUTABILITYPOLICIES/DELETE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/MANAGEMENTPOLICIES/WRITE
          - MICROSOFT.STORAGE/STORAGEACCOUNTS/MANAGEMENTPOLICIES/DELETE
        basis: >-
          Legal hold and immutability policies are what stop a blob being deleted
          or overwritten. Removing them is the step before destruction, and it is
          the only step that leaves a trace once the data is gone. Lifecycle
          management policies belong here too: a policy can be rewritten to expire
          data on a schedule, which destroys it without a delete ever being issued.

      # ── Automation Account ─────────────────────────────────────────────────
      - id: T1651
        operations:
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/RUNBOOKS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/RUNBOOKS/DRAFT/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/RUNBOOKS/DRAFT/CONTENT/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/RUNBOOKS/PUBLISH/ACTION
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/JOBS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/RUNBOOKS/DRAFT/TESTJOB/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/MODULES/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/PYTHON2PACKAGES/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/PYTHON3PACKAGES/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/CONFIGURATIONS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/COMPILATIONJOBS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/NODECONFIGURATIONS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/NODES/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/HYBRIDRUNBOOKWORKERGROUPS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/HYBRIDRUNBOOKWORKERGROUPS/HYBRIDRUNBOOKWORKERS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/HYBRIDRUNBOOKWORKERGROUPS/HYBRIDRUNBOOKWORKERS/MOVE/ACTION
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/SOFTWAREUPDATECONFIGURATIONS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WATCHERS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WATCHERS/START/ACTION
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WATCHERS/WATCHERACTIONS/WRITE
        basis: >-
          An Automation account runs arbitrary PowerShell and Python with an
          identity of its own, which makes every one of these code execution in the
          tenant. Writing or publishing a runbook, starting a job, uploading a
          module or package, and pushing a DSC configuration are all the same act
          through different doors.

          The hybrid worker operations are the sharpest and the least obvious. A
          hybrid runbook worker executes on a machine INSIDE the network, so
          registering one is a cloud-to-on-premises bridge: an attacker with ARM
          access and no foothold gets code running on a domain-joined server.
      - id: T1546
        operations:
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WEBHOOKS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/SCHEDULES/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/JOBSCHEDULES/WRITE
        basis: >-
          A webhook is a URL that runs a runbook with NO authentication -- the URL
          is the credential, it is shown once at creation, and it survives the
          account that made it. Schedules are the patient version: create one, wait,
          and the code runs without the attacker present.

          Scheduled Task/Job (T1053) would read better and is not available: ATT&CK
          lists it for Windows, Linux and containers, with no cloud platform, so it
          cannot be used on this table.
      - id: T1552
        operations:
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/LISTKEYS/ACTION
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/JOBS/RUNBOOKCONTENT/ACTION
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/NODECONFIGURATIONS/RAWCONTENT/ACTION
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/SOURCECONTROLS/LISTKEYS/WRITE
        basis: >-
          Reading what the account already holds. Runbook content is the one people
          miss: jobs/runbookContent returns the script a job ran, and runbooks are
          where hardcoded connection strings and passwords live. Source control keys
          are the access token for the repository the runbooks come from.
      - id: T1098.001
        operations:
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/CREDENTIALS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/CERTIFICATES/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/CONNECTIONS/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/VARIABLES/WRITE
          - MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/AGENTREGISTRATIONINFORMATION/REGENERATEKEY/ACTION
        basis: >-
          Automation assets ARE credentials: a credential asset is a username and
          password, a connection asset holds service principal details, a
          certificate asset holds a private key, and an encrypted variable holds
          whatever was put in it. Writing one plants a credential the account's own
          runbooks will then use.

          The DSC agent registration key is here too: regenerating it produces the
          key any machine needs to enrol itself as a managed node.

      - id: T1489
        operations:
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/POWEROFF/ACTION
          - MICROSOFT.COMPUTE/VIRTUALMACHINES/DEALLOCATE/ACTION
        basis: >-
          Stopping a VM stops whatever it was running, and a security appliance or
          a domain controller is a VM like any other. Noisy: ordinary cost
          management deallocates machines nightly, so this is worth watching only
          on machines that should never stop.

      - id: T1535
        operations: []
        basis: >-
          Resource creation in an unused region. No single operation identifies it —
          it is a location-anomaly over ordinary write operations, so table resolution only.

      # ── Key Vault, control plane ───────────────────────────────────────────
      # The first service given its own section here. AzureActivity is ONE table
      # behind all ten ARM targets, and it held 17 operations in total -- so
      # "Key Vault" and "Resource Group" produced identical coverage, because
      # they were the same seventeen wearing different names.
      #
      # These come from Azure rather than from reading. Get-AzProviderOperation
      # returned 122 Microsoft.KeyVault operations; 36 end in /read, which this
      # table does not record; 53 are flagged isDataAction by Azure and land in
      # AZKVAuditLogs instead, where they are already mapped; six are both. That
      # leaves 39 that could appear here, and these are the twelve that mean
      # something. The other 27 are under `rejected`.
      - id: T1485
        operations:
          - MICROSOFT.KEYVAULT/VAULTS/DELETE
          - MICROSOFT.KEYVAULT/MANAGEDHSMS/DELETE
        basis: >-
          The vault or HSM is destroyed and every secret, key and certificate in it
          goes with it. Soft delete makes this recoverable; the purge below is what
          does not.
      - id: T1490
        operations: [MICROSOFT.KEYVAULT/LOCATIONS/DELETEDVAULTS/PURGE/ACTION]
        basis: >-
          Purging a soft-deleted vault removes the only copy that could be restored.
          Separated from the delete deliberately: deletion alone is reversible for
          the retention period, and this is the step that ends that.
      - id: T1098
        operations: [MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE]
        basis: >-
          Grants a principal access to the vault under the legacy permission model.
          The ARM twin of VaultPut/VaultPatch in AZKVAuditLogs -- same act, different
          door, and a tenant that reads only one of the two tables sees only one.
      - id: T1562
        operations:
          - MICROSOFT.KEYVAULT/VAULTS/WRITE
          - MICROSOFT.KEYVAULT/MANAGEDHSMS/WRITE
        basis: >-
          Carries the vault's firewall rules, soft-delete and purge protection. The
          weakest claim in this section and it is stated rather than hidden: one
          operation covers turning off purge protection and editing a tag, and the
          name cannot tell them apart. A detection on it MUST read the changed
          properties. Rejecting it instead would lose the firewall signal entirely.
      - id: T1555.006
        operations: [MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION]
        basis: >-
          Releases secrets to an ARM template deployment or a VM. Material leaves the
          vault without a single data-plane read, so a tenant watching only
          AZKVAuditLogs never sees it.
      - id: T1098.001
        operations:
          - MICROSOFT.KEYVAULT/VAULTS/SECRETS/WRITE
          - MICROSOFT.KEYVAULT/VAULTS/KEYS/WRITE
        basis: >-
          Writing material INTO the vault through ARM. The control-plane twins of
          SecretSet and KeyImport, which are already mapped here on the data-plane
          side.
      - id: T1562.008
        operations:
          - MICROSOFT.KEYVAULT/VAULTS/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
          - MICROSOFT.KEYVAULT/MANAGEDHSMS/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE
        basis: >-
          Rewriting the vault's diagnostic setting is how its audit log stops. Every
          data-plane mapping in this repo assumes AZKVAuditLogs is receiving data;
          this operation is how that assumption is made false.
      - id: T1562.007
        operations: [MICROSOFT.KEYVAULT/VAULTS/PRIVATEENDPOINTCONNECTIONSAPPROVAL/ACTION]
        basis: >-
          Approving a private endpoint connection changes who can reach the vault over
          the network. A judgment call, and the line drawn is decision versus
          machinery: this approves, while the thirteen proxy operations under
          `rejected` are Azure's own wiring for carrying it out.

      # ── SQL Server ─────────────────────────────────────────────────────────
      # Microsoft.Sql/servers, 163 control-plane operations. A logical SQL server
      # is two things at once: an identity boundary with its own admin and its own
      # firewall, and a data store with its own encryption, backups and audit. Both
      # halves are attacked through ARM without a single database login.
      - id: T1098
        operations:
          - MICROSOFT.SQL/SERVERS/ADMINISTRATORS/WRITE
          - MICROSOFT.SQL/SERVERS/ADMINISTRATORS/DELETE
          - MICROSOFT.SQL/SERVERS/AZUREADONLYAUTHENTICATIONS/WRITE
          - MICROSOFT.SQL/SERVERS/AZUREADONLYAUTHENTICATIONS/DELETE
          - MICROSOFT.SQL/SERVERS/EXTERNALPOLICYBASEDAUTHORIZATIONS/WRITE
          - MICROSOFT.SQL/SERVERS/EXTERNALPOLICYBASEDAUTHORIZATIONS/DELETE
        basis: >-
          The Entra admin of a SQL server is a database owner. Writing it hands that
          role to any principal, and it is an ARM write -- no database credential is
          involved at any point.

          The Entra-only authentication pair is the sharper one and it reads
          backwards. DELETE is the dangerous direction. While Entra-only
          authentication is on, the server's SQL logins and its password-based
          admin are refused. Deleting the setting turns them back on, and a SQL
          login is not an Entra identity: conditional access does not see it, MFA
          does not apply to it, and sign-in risk is never evaluated. One ARM delete
          reopens a door that bypasses the tenant's whole identity stack.
      - id: T1098.001
        operations:
          - MICROSOFT.SQL/SERVERS/KEYS/WRITE
          - MICROSOFT.SQL/SERVERS/TDECERTIFICATES/ACTION
          - MICROSOFT.SQL/SERVERS/JOBAGENTS/CREDENTIALS/WRITE
          - MICROSOFT.SQL/SERVERS/SYNCAGENTS/WRITE
          - MICROSOFT.SQL/SERVERS/SYNCAGENTS/GENERATEKEY/ACTION
        basis: >-
          Material added to the server rather than taken from it. A server key
          registers a Key Vault key for encryption, and tdeCertificates uploads a
          certificate outright.

          The job credential is the one that carries the most: an elastic job runs
          T-SQL against every database in a target group under a credential stored
          here, so writing one plants the account those jobs will use.

          The sync agent key is a registration key for a machine on-premises. It is
          shown once, and whoever holds it can register a sync agent as that server.
      - id: T1537
        operations:
          - MICROSOFT.SQL/SERVERS/DATABASES/EXPORT/ACTION
          - MICROSOFT.SQL/SERVERS/DATABASES/REPLICATIONLINKS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/SYNCGROUPS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/SYNCGROUPS/SYNCMEMBERS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/SYNCGROUPS/TRIGGERSYNC/ACTION
          - MICROSOFT.SQL/SERVERS/FAILOVERGROUPS/WRITE
          - MICROSOFT.SQL/SERVERS/DISASTERRECOVERYCONFIGURATION/WRITE
        basis: >-
          Export is the whole database leaving in one call. It writes a bacpac to a
          storage account the CALLER names, which does not have to belong to the
          tenant, and it needs no database login -- ARM permission on the server is
          the entire prerequisite. This is the single highest-value SQL operation
          in the table.

          The rest are the continuous version. A replication link, a failover group
          and the legacy disaster-recovery configuration each create a second copy
          of the data on another server that keeps itself up to date. A sync group
          is the same idea with a member list, and triggerSync forces a copy now.

          Both shapes are legitimate operations that a DBA performs. What makes
          them worth watching is the destination, so a detection here has to read
          the target and cannot rest on the operation name alone.
      - id: T1562.007
        operations:
          - MICROSOFT.SQL/SERVERS/WRITE
          - MICROSOFT.SQL/SERVERS/CONNECTIONPOLICIES/WRITE
          - MICROSOFT.SQL/SERVERS/FIREWALLRULES/WRITE
          - MICROSOFT.SQL/SERVERS/FIREWALLRULES/DELETE
          - MICROSOFT.SQL/SERVERS/IPV6FIREWALLRULES/WRITE
          - MICROSOFT.SQL/SERVERS/IPV6FIREWALLRULES/DELETE
          - MICROSOFT.SQL/SERVERS/VIRTUALNETWORKRULES/WRITE
          - MICROSOFT.SQL/SERVERS/VIRTUALNETWORKRULES/DELETE
          - MICROSOFT.SQL/SERVERS/OUTBOUNDFIREWALLRULES/WRITE
          - MICROSOFT.SQL/SERVERS/OUTBOUNDFIREWALLRULES/DELETE
          - MICROSOFT.SQL/SERVERS/PRIVATEENDPOINTCONNECTIONSAPPROVAL/ACTION
          - MICROSOFT.SQL/SERVERS/NETWORKSECURITYPERIMETERASSOCIATIONPROXIES/DELETE
        basis: >-
          A SQL server is reachable from the public internet by name. Its firewall
          is the only thing deciding who gets to try a password, so every rule
          operation here changes the size of the attack surface.

          Azure keeps four separate rule types and all four are the same control:
          IPv4 rules, IPv6 rules, virtual network rules, and outbound rules that
          allow-list where the server itself may connect. A tenant watching only
          firewallRules misses the other three.

          The server write is included for the same reason the Key Vault write is,
          and with the same weakness: it carries publicNetworkAccess and the
          minimum TLS version alongside ordinary property edits, so a detection on
          it MUST read the changed properties. The connection policy is quieter --
          it switches between Proxy and Redirect, and Redirect exposes the backend
          node port range directly to the client.

          Deleting the network security perimeter association removes the perimeter
          from the server. The write direction adds protection and is rejected.
      - id: T1562.008
        operations:
          - MICROSOFT.SQL/SERVERS/AUDITINGSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/AUDITINGSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/EXTENDEDAUDITINGSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/EXTENDEDAUDITINGSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/DEVOPSAUDITINGSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/LEDGERDIGESTUPLOADS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/LEDGERDIGESTUPLOADS/DISABLE/ACTION
        basis: >-
          SQL auditing is what fills SQLSecurityAuditEvents. Turning it off at the
          server silences every database under it, and these operations are how
          that happens.

          Azure exposes the same control three times over -- auditingSettings,
          extendedAuditingSettings and devOpsAuditingSettings -- at both server and
          database level. They are separate API surfaces with separate permissions,
          so a detection written for one of them does not fire on the others.

          The ledger operations are different in kind and belong here anyway.
          Ledger digest uploads publish a cryptographic digest of the database's
          history to immutable storage, which is what makes ledger tamper-evident.
          Disabling the upload does not alter data -- it removes the ability to
          later prove that data was not altered.
      - id: T1562
        operations:
          - MICROSOFT.SQL/SERVERS/SECURITYALERTPOLICIES/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/SECURITYALERTPOLICIES/WRITE
          - MICROSOFT.SQL/SERVERS/ADVANCEDTHREATPROTECTIONSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/ADVANCEDTHREATPROTECTIONSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/VULNERABILITYASSESSMENTS/WRITE
          - MICROSOFT.SQL/SERVERS/VULNERABILITYASSESSMENTS/DELETE
          - MICROSOFT.SQL/SERVERS/DATABASES/VULNERABILITYASSESSMENTS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/VULNERABILITYASSESSMENTS/DELETE
          - MICROSOFT.SQL/SERVERS/SQLVULNERABILITYASSESSMENTS/WRITE
          - MICROSOFT.SQL/SERVERS/SQLVULNERABILITYASSESSMENTS/DELETE
          - MICROSOFT.SQL/SERVERS/DATABASES/VULNERABILITYASSESSMENTSETTINGS/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/DATAMASKINGPOLICIES/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/DATAMASKINGPOLICIES/RULES/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/SCHEMAS/TABLES/COLUMNS/SENSITIVITYLABELS/DISABLE/ACTION
          - MICROSOFT.SQL/SERVERS/DATABASES/SCHEMAS/TABLES/COLUMNS/SENSITIVITYLABELS/DELETE
          - MICROSOFT.SQL/SERVERS/SQLVULNERABILITYASSESSMENTS/BASELINES/WRITE
          - MICROSOFT.SQL/SERVERS/SQLVULNERABILITYASSESSMENTS/BASELINES/RULES/WRITE
          - MICROSOFT.SQL/SERVERS/SQLVULNERABILITYASSESSMENTS/BASELINES/RULES/DELETE
          - MICROSOFT.SQL/SERVERS/DATABASES/SQLVULNERABILITYASSESSMENTS/BASELINES/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/SQLVULNERABILITYASSESSMENTS/BASELINES/RULES/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/SQLVULNERABILITYASSESSMENTS/BASELINES/RULES/DELETE
          - MICROSOFT.SQL/SERVERS/DATABASES/VULNERABILITYASSESSMENTS/RULES/BASELINES/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/VULNERABILITYASSESSMENTS/RULES/BASELINES/DELETE
        basis: >-
          Everything Microsoft Defender for SQL provides is switched on and off
          through these operations. Security alert policies are the alerting, the
          advanced threat protection settings are the detection, and the
          vulnerability assessment is the scanning. All three exist at server and
          database level and all three take a write that can disable them.

          The baseline operations are the quiet ones. A vulnerability assessment
          baseline declares a finding to be expected, and a rule with a baseline
          stops reporting. Nothing is switched off and the scan still runs green,
          so writing a baseline over a real finding hides it without any operation
          in this table naming disable.

          Data masking is a read control rather than a detection: it is what stops
          an ordinary application login from seeing full card numbers. Rewriting
          the policy or a rule removes that. Sensitivity labels feed masking and
          audit filtering, so the disable and delete directions belong here too.
          The write direction is how labels are applied in the first place and is
          rejected.
      - id: T1486
        operations:
          - MICROSOFT.SQL/SERVERS/ENCRYPTIONPROTECTOR/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/TRANSPARENTDATAENCRYPTION/WRITE
          - MICROSOFT.SQL/SERVERS/KEYS/DELETE
        basis: >-
          Transparent data encryption normally protects the data. Under an attacker
          it becomes the ransom. Writing the encryption protector repoints the
          server at a different key, and if that key lives in a vault the attacker
          controls, revoking access later leaves every database unreadable with no
          file ever touched.

          Deleting a server key is the same outcome reached faster: the data stays
          encrypted and the means of decrypting it is gone.

          The pairing with T1098.001 above is deliberate and not a duplicate.
          keys/write ADDS a key, which is credential material arriving. keys/delete
          REMOVES the key the data depends on, which is impact.
      - id: T1651
        operations:
          - MICROSOFT.SQL/SERVERS/JOBAGENTS/WRITE
          - MICROSOFT.SQL/SERVERS/JOBAGENTS/JOBS/WRITE
          - MICROSOFT.SQL/SERVERS/JOBAGENTS/JOBS/STEPS/WRITE
          - MICROSOFT.SQL/SERVERS/JOBAGENTS/JOBS/EXECUTIONS/WRITE
          - MICROSOFT.SQL/SERVERS/JOBAGENTS/TARGETGROUPS/WRITE
        basis: >-
          Elastic jobs are the SQL equivalent of an Automation runbook. A job step
          holds T-SQL, a target group names the databases it runs against, and an
          execution write starts it -- so an attacker with ARM permission on the
          server can run arbitrary queries against every database on it, using a
          stored credential, without holding a database login of their own.

          The target group is the one to watch. Widening it turns a job written for
          one database into a job that runs everywhere.
      - id: T1552
        operations: [MICROSOFT.SQL/SERVERS/DATABASES/TOPQUERIES/QUERYTEXT/ACTION]
        basis: >-
          Returns the text of a query that ran against the database. Query text
          holds the literal values that were passed with it, and dynamic SQL
          regularly carries connection strings and passwords inline.

          Worth separating from the rest: this is an ARM operation that reads
          database CONTENT. No database login is used and SQL auditing does not
          record it, so a tenant watching only SQLSecurityAuditEvents sees nothing.
      - id: T1485
        operations:
          - MICROSOFT.SQL/SERVERS/DELETE
          - MICROSOFT.SQL/SERVERS/DATABASES/DELETE
          - MICROSOFT.SQL/SERVERS/ELASTICPOOLS/DELETE
        basis: >-
          Deleting the server takes every database with it. Azure retains
          point-in-time backups for the configured window, so this is recoverable
          on its own -- the backup policy operations under T1490 are what make it
          permanent, which is why they are separated.
      - id: T1490
        operations:
          - MICROSOFT.SQL/SERVERS/DATABASES/BACKUPLONGTERMRETENTIONPOLICIES/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/BACKUPSHORTTERMRETENTIONPOLICIES/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/GEOBACKUPPOLICIES/WRITE
          - MICROSOFT.SQL/SERVERS/DATABASES/RESTOREPOINTS/DELETE
          - MICROSOFT.SQL/SERVERS/FAILOVERGROUPS/DELETE
          - MICROSOFT.SQL/SERVERS/DISASTERRECOVERYCONFIGURATION/DELETE
          - MICROSOFT.SQL/SERVERS/DATABASES/REPLICATIONLINKS/DELETE
          - MICROSOFT.SQL/SERVERS/DATABASES/REPLICATIONLINKS/UNLINK/ACTION
        basis: >-
          Recovery for Azure SQL rests on three separate things: the short-term
          point-in-time window, long-term retention, and a geo-redundant copy. Each
          has its own write, and shortening any of them silently discards the
          backups that fall outside the new window.

          This is the step that has to come BEFORE the delete for the delete to
          stick, which makes the order the signal: a retention write followed by a
          database delete is a different event from either one alone.

          Breaking a replication link or a failover group removes the standing
          second copy. Creating one is under T1537 -- the same relationship, read
          from the other end.
      - id: T1489
        operations:
          - MICROSOFT.SQL/SERVERS/DATABASES/PAUSE/ACTION
          - MICROSOFT.SQL/SERVERS/DATABASES/FAILOVER/ACTION
          - MICROSOFT.SQL/SERVERS/ELASTICPOOLS/FAILOVER/ACTION
          - MICROSOFT.SQL/SERVERS/FAILOVERGROUPS/FAILOVER/ACTION
          - MICROSOFT.SQL/SERVERS/FAILOVERGROUPS/FORCEFAILOVERALLOWDATALOSS/ACTION
          - MICROSOFT.SQL/SERVERS/FAILOVERGROUPS/TRYPLANNEDBEFOREFORCEDFAILOVER/ACTION
          - MICROSOFT.SQL/SERVERS/DISASTERRECOVERYCONFIGURATION/FAILOVER/ACTION
          - MICROSOFT.SQL/SERVERS/DISASTERRECOVERYCONFIGURATION/FORCEFAILOVERALLOWDATALOSS/ACTION
          - MICROSOFT.SQL/SERVERS/DATABASES/REPLICATIONLINKS/FAILOVER/ACTION
          - MICROSOFT.SQL/SERVERS/DATABASES/REPLICATIONLINKS/FORCEFAILOVERALLOWDATALOSS/ACTION
        basis: >-
          Pausing a database takes it offline and every application on it fails to
          connect.

          The failover operations are listed in full because Azure names the same
          act four times, once per replication shape, and the forceFailover
          variants say what they do in the operation name: allow data loss. A
          forced failover promotes the secondary while the primary is still ahead
          of it, and whatever had not replicated is gone. Ordinary failover is
          routine maintenance and drills; the forced ones are worth a higher
          severity than the rest.
      # ── App Service ────────────────────────────────────────────────────────
      # Microsoft.Web/sites, 207 control-plane operations. Ninety-one of them are
      # deployment slots, which Azure lists under this same resource type. A slot
      # is a live copy of the app with its own settings and its own publishing
      # credentials, and it is usually watched less closely than production, so
      # every slot operation here carries the same verdict as its site twin
      # rather than being left out.
      - id: T1552
        operations:
          - MICROSOFT.WEB/SITES/CONFIG/LIST/ACTION
          - MICROSOFT.WEB/SITES/CONFIG/SNAPSHOTS/LISTSECRETS/ACTION
          - MICROSOFT.WEB/SITES/FUNCTIONS/LISTKEYS/ACTION
          - MICROSOFT.WEB/SITES/FUNCTIONS/LISTSECRETS/ACTION
          - MICROSOFT.WEB/SITES/HOST/LISTKEYS/ACTION
          - MICROSOFT.WEB/SITES/HOSTRUNTIME/WEBHOOKS/API/WORKFLOWS/TRIGGERS/LISTCALLBACKURL/ACTION
          - MICROSOFT.WEB/SITES/HYBRIDCONNECTIONNAMESPACES/RELAYS/LISTKEYS/ACTION
          - MICROSOFT.WEB/SITES/PUBLISHXML/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/CONFIG/LIST/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/CONFIG/SNAPSHOTS/LISTSECRETS/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/FUNCTIONS/LISTKEYS/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/FUNCTIONS/LISTSECRETS/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/HOST/LISTKEYS/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/PUBLISHXML/ACTION
        basis: >-
          One ARM call returns every secret the app holds. config/list is Azure's
          own description, not a reading of it: "List Web App's security sensitive
          settings, such as publishing credentials, app settings and connection
          strings". App settings are where database passwords, API keys and client
          secrets live in App Service, so this single operation is the whole store.

          publishxml returns the publishing profile, which carries the deployment
          username and password in plain text. The function key operations are the
          same shape one level down: a function key is a bearer token that invokes
          the function, and a host key invokes any function in the app.

          None of these needs a code deployment, a restart or a login to the app.
          They are reads, and they are the highest-value reads on this resource.

          They are also avoidable. Function keys live by default in a blob container
          in the app's OWN storage account, so an attacker who can read that account
          gets the same keys without issuing a single operation in this block. Watch
          Microsoft.Storage listkeys and the blob reads in StorageBlobLogs alongside
          these: a rule built only on this block covers the loud half of the path.
      - id: T1098.001
        operations:
          - MICROSOFT.WEB/SITES/CONFIG/WEB/CONNECTIONSTRINGS/WRITE
          - MICROSOFT.WEB/SITES/FUNCTIONS/KEYS/WRITE
          - MICROSOFT.WEB/SITES/HOST/FUNCTIONKEYS/WRITE
          - MICROSOFT.WEB/SITES/HOST/SYSTEMKEYS/WRITE
          - MICROSOFT.WEB/SITES/NEWPASSWORD/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/CONFIG/WEB/CONNECTIONSTRINGS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/FUNCTIONS/KEYS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/HOST/FUNCTIONKEYS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/HOST/SYSTEMKEYS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/NEWPASSWORD/ACTION
        basis: >-
          Material planted for the app to use later. newpassword resets the
          publishing credential, which is how deployment authenticates over FTP and
          Git.

          A function key write mints a bearer token that invokes the function, and a
          host system key write mints one that reaches every function in the app.
          Both survive redeployment, which makes them a quiet way back in after the
          original access is closed.

          Connection strings are here rather than under configuration because that
          is what they are: a credential to a backing store, written through ARM and
          readable through config/list above.
      - id: T1537
        operations:
          - MICROSOFT.WEB/SITES/BACKUP/ACTION
          - MICROSOFT.WEB/SITES/BACKUP/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/BACKUP/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/BACKUP/WRITE
        basis: >-
          An App Service backup is a copy of the app's files AND the databases named
          in its configuration, and the configuration REQUIRES a storageAccountUrl,
          which Azure documents as a SAS URL to a container. A SAS URL does not have
          to belong to the tenant.

          So writing the backup configuration chooses where a full copy of the
          application and its data will be written, and the backup action produces
          that copy on demand. The same shape as the SQL export, reached through a
          feature that reads as protective.
      - id: T1040
        operations:
          - MICROSOFT.WEB/SITES/NETWORKTRACE/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/NETWORKTRACE/ACTION
        basis: >-
          Captures a network trace on the instance the app runs on. Traffic the
          application sends to its backing services passes through it, and a capture
          is a file the caller then downloads.

          Rare in ordinary operation, which is what makes it worth a rule: nobody
          runs a packet capture on a production web app by accident.
      - id: T1556
        operations:
          - MICROSOFT.WEB/SITES/BASICPUBLISHINGCREDENTIALSPOLICIES/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/BASICPUBLISHINGCREDENTIALSPOLICIES/WRITE
        basis: >-
          Controls whether basic authentication is allowed for publishing, over SCM
          and over FTP. Azure ships it off by default for new apps.

          Turning it on re-opens username-and-password publishing, and a publishing
          credential is not an Entra identity: conditional access does not see it,
          MFA does not apply, and sign-in risk is never evaluated. Paired with the
          newpassword operation under T1098.001, it is a complete way in that the
          tenant's identity controls never touch.
      - id: T1651
        operations:
          - MICROSOFT.WEB/SITES/APPLYSLOTCONFIG/ACTION
          - MICROSOFT.WEB/SITES/CONFIG/WEB/APPSETTINGS/WRITE
          - MICROSOFT.WEB/SITES/CONFIG/WRITE
          - MICROSOFT.WEB/SITES/DEPLOYMENTS/WRITE
          - MICROSOFT.WEB/SITES/DEPLOYWORKFLOWARTIFACTS/ACTION
          - MICROSOFT.WEB/SITES/EXTENSIONS/API/ACTION
          - MICROSOFT.WEB/SITES/EXTENSIONS/WRITE
          - MICROSOFT.WEB/SITES/FUNCTIONS/ACTION
          - MICROSOFT.WEB/SITES/FUNCTIONS/WRITE
          - MICROSOFT.WEB/SITES/HOSTRUNTIME/HOST/ACTION
          - MICROSOFT.WEB/SITES/HOSTRUNTIME/WEBHOOKS/API/WORKFLOWS/TRIGGERS/RUN/ACTION
          - MICROSOFT.WEB/SITES/PUBLISH/ACTION
          - MICROSOFT.WEB/SITES/RESTOREFROMBACKUPBLOB/ACTION
          - MICROSOFT.WEB/SITES/SITECONTAINERS/WRITE
          - MICROSOFT.WEB/SITES/SITEEXTENSIONS/WRITE
          - MICROSOFT.WEB/SITES/SLOTCOPY/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/APPLYSLOTCONFIG/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/CONFIG/APPSETTINGS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/CONFIG/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/DEPLOYMENTS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/DEPLOYWORKFLOWARTIFACTS/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/EXTENSIONS/API/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/EXTENSIONS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/PUBLISH/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/RESTOREFROMBACKUPBLOB/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/SITECONTAINERS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/SITEEXTENSIONS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/SLOTCOPY/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/SLOTSSWAP/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/SOURCECONTROLS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/STARTDEVSESSION/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/TRIGGEREDWEBJOBS/RUN/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/WRITE
          - MICROSOFT.WEB/SITES/SLOTSSWAP/ACTION
          - MICROSOFT.WEB/SITES/SOURCECONTROLS/WRITE
          - MICROSOFT.WEB/SITES/STARTDEVSESSION/ACTION
          - MICROSOFT.WEB/SITES/TRIGGEREDWEBJOBS/RUN/ACTION
          - MICROSOFT.WEB/SITES/WRITE
        basis: >-
          Every way code arrives at, or runs on, an App Service instance. There are
          more doors than any other service in this table and they are all the same
          act: publish, a source control connection that deploys on push, a
          deployment write, a site extension that loads into the app's own process,
          a container image, a function, a WebJob run, a Logic App workflow
          artifact, and the Kudu extensions API.

          Two are worth naming on their own. slotsswap promotes a deployment slot
          into production, so an attacker can stage code in a slot nobody watches
          and then make it live in one call. restorefrombackupblob rebuilds the app
          from a blob the CALLER names, which is arbitrary content becoming the
          running application.

          config/write is here because it carries appCommandLine, the command the
          app launches with, and linuxFxVersion, the runtime image. It also carries
          the IP restrictions, which is why it appears again under T1562.007. One
          operation, two meanings, and a detection on it MUST read the changed
          properties to say which.
      - id: T1546
        operations:
          - MICROSOFT.WEB/SITES/CONTINUOUSWEBJOBS/START/ACTION
          - MICROSOFT.WEB/SITES/EVENTGRIDFILTERS/WRITE
          - MICROSOFT.WEB/SITES/SLOTS/CONTINUOUSWEBJOBS/START/ACTION
        basis: >-
          Arranging for code to run without the attacker present. A continuous
          WebJob restarts with the app and keeps running, so starting one is
          persistence rather than a single execution. An Event Grid filter
          subscribes the app to events, which invokes it whenever they arrive.

          Scheduled Task/Job (T1053) would read better for the WebJob and is not
          available: ATT&CK lists it for Windows, Linux and containers with no cloud
          platform at all.
      - id: T1562.007
        operations:
          - MICROSOFT.WEB/SITES/CONFIG/WRITE
          - MICROSOFT.WEB/SITES/NETWORKSECURITYPERIMETERASSOCIATIONPROXIES/DELETE
          - MICROSOFT.WEB/SITES/PRIVATEENDPOINTCONNECTIONSAPPROVAL/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/CONFIG/WRITE
        basis: >-
          App Service IP restrictions live in the site configuration, under
          ipSecurityRestrictions for the app and scmIpSecurityRestrictions for the
          deployment endpoint. config/write is the operation that changes them, so
          it is the App Service firewall.

          It is the weakest claim in this section and it is stated rather than
          hidden: the same operation carries the startup command, the minimum TLS
          version, whether FTP is allowed, whether remote debugging is on, and
          ordinary settings nobody cares about. It is mapped under T1651 as well for
          that reason. A detection here has to read the changed properties.

          Approving a private endpoint connection changes who can reach the app over
          the network, and removing the network security perimeter association takes
          a perimeter off it.
      - id: T1485
        operations:
          - MICROSOFT.WEB/SITES/DELETE
          - MICROSOFT.WEB/SITES/SLOTS/DELETE
        basis: >-
          The app and everything deployed to it are gone. Azure keeps a deleted app
          recoverable for a period, and the restore operations that undo this are
          rejected as the recovering direction.
      - id: T1490
        operations:
          - MICROSOFT.WEB/SITES/BACKUPS/DELETE
          - MICROSOFT.WEB/SITES/BACKUPS/WRITE
          - MICROSOFT.WEB/SITES/DEPLOYMENTS/DELETE
          - MICROSOFT.WEB/SITES/INSTANCES/DEPLOYMENTS/DELETE
          - MICROSOFT.WEB/SITES/SLOTS/BACKUPS/DELETE
          - MICROSOFT.WEB/SITES/SLOTS/DEPLOYMENTS/DELETE
        basis: >-
          Removing what the app could be rolled back to. Deployment history is App
          Service's own rollback: each deployment is retained and can be redeployed,
          so deleting the history removes the fast way back to a known good version.

          Backups are the slower way back. Deleting them, or rewriting one, closes
          that too. The backup CONFIGURATION is not here -- it names the destination
          container, which makes it exfiltration, and it is mapped under T1537.
      - id: T1489
        operations:
          - MICROSOFT.WEB/SITES/CONTINUOUSWEBJOBS/STOP/ACTION
          - MICROSOFT.WEB/SITES/INSTANCES/PROCESSES/DELETE
          - MICROSOFT.WEB/SITES/INSTANCES/PROCESSES/STOP/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/CONTINUOUSWEBJOBS/STOP/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/INSTANCES/PROCESSES/DELETE
          - MICROSOFT.WEB/SITES/SLOTS/INSTANCES/PROCESSES/STOP/ACTION
          - MICROSOFT.WEB/SITES/SLOTS/STOP/ACTION
          - MICROSOFT.WEB/SITES/STOP/ACTION
        basis: >-
          Stopping the app takes the site offline and every request to it fails.
          Killing an instance process does the same thing to one worker at a time
          and reads as a crash rather than as an action.

          Noisy in isolation: deployments stop and start apps routinely, so this is
          worth watching on apps that should never stop, or alongside another
          signal.
    # Considered and deliberately not mapped, per SERVICE. AzureActivity carries
    # every ARM provider, so a single flat rejection list would be meaningless --
    # completeness here is claimed one service at a time, and only for services
    # whose operations have actually been read.
    rejected_by_service:
      # Scoped by RESOURCE TYPE where a provider holds more than the target
      # names. Microsoft.Network has 750 control-plane writes across 249 resource
      # types; six of them are network security groups. Key Vault below is
      # provider-scoped, which is a superset of Microsoft.KeyVault/vaults and
      # therefore stricter, not looser.
      Microsoft.Compute/virtualMachines:
        # Patching. Keeping a machine unpatched is a real objective, but every
        # tenant with update management runs these constantly and none of them
        # changes access, data or logging.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/ASSESSPATCHES/ACTION: >-
          Lists available OS updates. A read dressed as an action.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/INSTALLPATCHES/ACTION: >-
          Installing updates is the opposite of an attack.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/CANCELPATCHINSTALLATION/ACTION: >-
          Cancelling a patch run leaves a machine unpatched, which is a slow and
          indirect objective. Ordinary maintenance cancels these routinely and the
          operation alone cannot tell the two apart.
        # Power and platform lifecycle beyond the stop mapped above.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/START/ACTION: >-
          Starting a machine restores service. Stopping is what is mapped.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/RESTART/ACTION: >-
          A restart clears memory, which loses volatile evidence, but restarts are
          constant in normal operation and reimage is the destructive version that
          IS mapped.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/REDEPLOY/ACTION: >-
          Moves a VM to new host hardware. A platform remedy for a sick host.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/PERFORMMAINTENANCE/ACTION: >-
          Azure-initiated host maintenance.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/REAPPLY/ACTION: >-
          Reapplies the VM's existing model. Nothing changes by definition.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/SIMULATEEVICTION/ACTION: >-
          A test hook for spot instances.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/SETVMHEALTH/ACTION: >-
          Scale-set health reporting, emitted by the platform.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/OSUPGRADEINTERNAL/ACTION: >-
          Scale-set internals. The name says it.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/UPGRADEVMAGENT/ACTION: >-
          Upgrading the Azure guest agent. Routine and initiated by the platform.
        # Everything else.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/GENERALIZE/ACTION: >-
          Marks a VM as generalized ahead of image capture. The capture itself is
          mapped and is where the copy is actually made.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/CONVERTTOMANAGEDDISKS/ACTION: >-
          A one-way migration from unmanaged to managed disks. Disruptive to get
          wrong, but it copies nothing out and grants nobody access.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/RETRIEVEBOOTDIAGNOSTICSDATA/ACTION: >-
          Returns URIs for boot logs and console screenshots. Genuinely a small
          disclosure -- a screenshot can show a logon banner or an error with a
          hostname in it -- but it reaches no disk and no credential, and it is
          what a support engineer opens first on any broken machine.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMANDS/DELETE: >-
          Deleting a stored run command removes the record of one that was
          created, and the creation is mapped. Worth revisiting if run-command
          cleanup ever turns up as an evasion pattern in the wild.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/DIAGNOSTICRUNCOMMANDS/DELETE: >-
          As above, for the diagnostic variant.
        MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/DELETE: >-
          Removing an extension can disable an endpoint agent, which is real
          defence evasion. Left out because extension churn is constant in any
          managed estate and the operation cannot say WHICH extension went. A
          detection here needs the extension name, which means reading properties
          rather than watching the operation.
