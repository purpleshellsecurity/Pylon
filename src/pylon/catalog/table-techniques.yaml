          Applies an index recommendation to one table. Storage and speed only.
        MICROSOFT.SQL/SERVERS/ELASTICPOOLESTIMATES/WRITE: >-
          Produces a sizing estimate for a proposed pool. A calculation that
          changes nothing on the server.
        MICROSOFT.SQL/SERVERS/DATABASES/QUERYSTORE/WRITE: >-
          Query Store retains query text and plans for performance troubleshooting.
          Turning it off does remove material that an investigator might want, and
          it is rejected anyway: it is a performance feature rather than a security
          control, no detection is built on it, and SQL auditing is unaffected. The
          audit surface that DOES matter is under T1562.008.
        # Workload and capacity management. Shrinking a pool or a workload group
        # can starve an application, which is a slow and unreliable denial of
        # service that ordinary resizing is indistinguishable from.
        MICROSOFT.SQL/SERVERS/ELASTICPOOLS/WRITE: >-
          Creates or resizes an elastic pool. Resizing down degrades performance
          for everything in it, but scaling is routine and the operation name
          cannot tell a cost saving from an attack.
        MICROSOFT.SQL/SERVERS/DATABASES/WORKLOADGROUPS/WRITE: >-
          Sets CPU and memory shares for a workload group. Capacity, not access.
        MICROSOFT.SQL/SERVERS/DATABASES/WORKLOADGROUPS/DELETE: >-
          Drops a workload group. Its members fall back to the default share.
        MICROSOFT.SQL/SERVERS/DATABASES/WORKLOADGROUPS/WORKLOADCLASSIFIERS/WRITE: >-
          Decides which workload group a session lands in. Scheduling only.
        MICROSOFT.SQL/SERVERS/DATABASES/WORKLOADGROUPS/WORKLOADCLASSIFIERS/DELETE: >-
          Drops a classifier. Sessions fall back to the default group.
        # Sensitivity labels, the applying direction. Classification is the work a
        # data protection programme does; the disable and delete directions are
        # mapped under T1562 instead.
        MICROSOFT.SQL/SERVERS/DATABASES/SCHEMAS/TABLES/COLUMNS/SENSITIVITYLABELS/WRITE: >-
          Sets the label on a column. A write can downgrade a label as well as
          apply one, and the operation name cannot say which. Labelling runs
          constantly wherever it is used at all, so watching the write would
          bury the delete and disable that are mapped.
        MICROSOFT.SQL/SERVERS/DATABASES/SCHEMAS/TABLES/COLUMNS/SENSITIVITYLABELS/ENABLE/ACTION: >-
          Turns recommendations back on for a column. The restoring direction.
        MICROSOFT.SQL/SERVERS/DATABASES/CURRENTSENSITIVITYLABELS/WRITE: >-
          Batch version of the column label write above.
        MICROSOFT.SQL/SERVERS/DATABASES/RECOMMENDEDSENSITIVITYLABELS/WRITE: >-
          Batch update of Azure's own label suggestions, which are advisory until
          someone applies them.
        # Running a vulnerability scan is defensive work. Suppressing its findings
        # is the attack and that is mapped under T1562.
        MICROSOFT.SQL/SERVERS/SQLVULNERABILITYASSESSMENTS/INITIATESCAN/ACTION: >-
          Starts a scan. Finding weaknesses is the defender's activity.
        MICROSOFT.SQL/SERVERS/DATABASES/SQLVULNERABILITYASSESSMENTS/INITIATESCAN/ACTION: >-
          Starts a database scan.
        MICROSOFT.SQL/SERVERS/DATABASES/VULNERABILITYASSESSMENTSCANS/ACTION: >-
          The older name for starting a scan.
        MICROSOFT.SQL/SERVERS/DATABASES/VULNERABILITYASSESSMENTS/SCANS/INITIATESCAN/ACTION: >-
          A third spelling of the same scan start.
        MICROSOFT.SQL/SERVERS/DATABASES/VULNERABILITYASSESSMENTS/SCANS/EXPORT/ACTION: >-
          Renders an existing scan result for reading. It reveals the database's
          weaknesses to whoever calls it, which is worth noting and is not enough:
          the finding list is a security report rather than data, and anyone with
          the permission to export it already has the permission to scan.
        # Encryption maintenance. The write that repoints a key is mapped under
        # T1486; these move the state back or re-check it.
        MICROSOFT.SQL/SERVERS/ENCRYPTIONPROTECTOR/REVALIDATE/ACTION: >-
          Re-checks that the server can still reach its key. A health check.
        MICROSOFT.SQL/SERVERS/DATABASES/ENCRYPTIONPROTECTOR/REVALIDATE/ACTION: >-
          The database-level health check.
        MICROSOFT.SQL/SERVERS/DATABASES/ENCRYPTIONPROTECTOR/REVERT/ACTION: >-
          Returns a database to the server's default key. The undoing direction.
        MICROSOFT.SQL/SERVERS/DATABASES/TRANSPARENTDATAENCRYPTION/SUSPEND/ACTION: >-
          Pauses the background encryption scan. It does not decrypt anything and
          it does not make data readable to anyone who could not already read it.
        MICROSOFT.SQL/SERVERS/DATABASES/TRANSPARENTDATAENCRYPTION/RESUME/ACTION: >-
          Resumes the scan. The restoring direction.
        # Sync and replication teardown. Creating these relationships copies data
        # elsewhere and is mapped under T1537; removing them stops the copying.
        MICROSOFT.SQL/SERVERS/DATABASES/SYNCGROUPS/DELETE: >-
          Removes a sync group, which ends the copying rather than starting it.
        MICROSOFT.SQL/SERVERS/DATABASES/SYNCGROUPS/SYNCMEMBERS/DELETE: >-
          Removes one member from a sync group.
        MICROSOFT.SQL/SERVERS/DATABASES/SYNCGROUPS/CANCELSYNC/ACTION: >-
          Cancels a sync already running.
        MICROSOFT.SQL/SERVERS/DATABASES/SYNCGROUPS/REFRESHHUBSCHEMA/ACTION: >-
          Re-reads the hub database's schema so sync knows the current columns.
        MICROSOFT.SQL/SERVERS/DATABASES/SYNCGROUPS/SYNCMEMBERS/REFRESHSCHEMA/ACTION: >-
          The same schema refresh for one member.
        MICROSOFT.SQL/SERVERS/SYNCAGENTS/DELETE: >-
          Removes a sync agent registration. The key generation that lets one
          register is mapped under T1098.001.
        MICROSOFT.SQL/SERVERS/DATABASES/REPLICATIONLINKS/UPDATEREPLICATIONMODE/ACTION: >-
          Switches a link between synchronous and asynchronous. It changes how far
          behind the secondary is allowed to be, not who holds a copy.
        # Elastic job teardown. Creating and running jobs is mapped under T1651.
        MICROSOFT.SQL/SERVERS/JOBAGENTS/DELETE: >-
          Removes the job agent, which stops jobs rather than running them.
        MICROSOFT.SQL/SERVERS/JOBAGENTS/JOBS/DELETE: >-
          Removes a job definition.
        MICROSOFT.SQL/SERVERS/JOBAGENTS/JOBS/STEPS/DELETE: >-
          Removes a step from a job.
        MICROSOFT.SQL/SERVERS/JOBAGENTS/TARGETGROUPS/DELETE: >-
          Removes a target group. Its jobs then have nothing to run against.
        MICROSOFT.SQL/SERVERS/JOBAGENTS/CREDENTIALS/DELETE: >-
          Removes a stored job credential. Breaks the jobs that used it; the write
          direction, which plants one, is mapped under T1098.001.
        MICROSOFT.SQL/SERVERS/JOBAGENTS/PRIVATEENDPOINTS/WRITE: >-
          A private endpoint for the job agent to reach its targets. Restrictive
          plumbing, and the same judgment as the server's own endpoint operations
          below.
        MICROSOFT.SQL/SERVERS/JOBAGENTS/PRIVATEENDPOINTS/DELETE: >-
          Removes that plumbing.
        # DNS aliases. Acquiring an alias repoints a server name at a different
        # server, so connection strings that use the alias reach somewhere new.
        # That is a real risk and no cloud technique covers it: ATT&CK places
        # Adversary-in-the-Middle (T1557) on Windows, Linux, macOS and network
        # devices only, and the domain techniques under Acquire and Compromise
        # Infrastructure are PRE-ATT&CK, not IaaS. Recorded here rather than
        # forced into a technique that does not list a cloud platform.
        MICROSOFT.SQL/SERVERS/DNSALIASES/ACQUIRE/ACTION: >-
          Takes an alias from another server and repoints it here. Genuinely
          dangerous and left unmapped because no ATT&CK technique for name
          takeover lists a cloud platform. A tenant using SQL DNS aliases should
          watch this operation directly.
        MICROSOFT.SQL/SERVERS/DNSALIASES/WRITE: >-
          Creates an alias on this server. The acquire above is the takeover.
        MICROSOFT.SQL/SERVERS/DNSALIASES/DELETE: >-
          Removes an alias, which breaks connection strings rather than
          redirecting them.
        # Private endpoint machinery. Azure's own wiring for carrying out a
        # connection, not the decision to allow one -- that is the approval
        # action, which is mapped.
        MICROSOFT.SQL/SERVERS/PRIVATEENDPOINTCONNECTIONS/WRITE: >-
          Records the connection the approval already decided on. Watching both
          means alerting twice on one act.
        MICROSOFT.SQL/SERVERS/PRIVATEENDPOINTCONNECTIONS/DELETE: >-
          Removing a private path is restrictive, not permissive.
        MICROSOFT.SQL/SERVERS/PRIVATEENDPOINTCONNECTIONPROXIES/WRITE: >-
          A connection proxy is internal plumbing. It appears alongside every
          approval and carries no separate decision.
        MICROSOFT.SQL/SERVERS/PRIVATEENDPOINTCONNECTIONPROXIES/DELETE: >-
          Internal plumbing, as above.
        MICROSOFT.SQL/SERVERS/PRIVATEENDPOINTCONNECTIONPROXIES/VALIDATE/ACTION: >-
          A validation step, which changes nothing.
        MICROSOFT.SQL/SERVERS/PRIVATEENDPOINTCONNECTIONPROXIES/UPDATEPRIVATEENDPOINTPROPERTIES/ACTION: >-
          Azure's network resource provider backfilling properties onto a
          connection it already created.
        # Network security perimeter, the tightening direction. Removing the
        # association is mapped under T1562.007.
        MICROSOFT.SQL/SERVERS/JOINPERIMETER/ACTION: >-
          Adds the server to a network security perimeter, which restricts it.
        MICROSOFT.SQL/SERVERS/NETWORKSECURITYPERIMETERASSOCIATIONPROXIES/WRITE: >-
          Creates the association that joinPerimeter above records.
        MICROSOFT.SQL/SERVERS/NETWORKSECURITYPERIMETERCONFIGURATIONS/RECONCILE/ACTION: >-
          Re-applies the perimeter configuration the server already has.
        # Database lifecycle. The security-bearing surfaces of a database --
        # auditing, encryption, backups, the server firewall -- are separate
        # operations and each is mapped above.
        MICROSOFT.SQL/SERVERS/DATABASES/WRITE: >-
          Creates a database or edits its properties. The one operation every
          deployment issues, and none of the properties it carries is a security
          control: auditing, encryption and backup retention each have their own
          write.
        MICROSOFT.SQL/SERVERS/IMPORT/ACTION: >-
          Creates a new database from a bacpac file. It adds data rather than
          taking it, and the export direction is what is mapped. ATT&CK offers no
          cloud-platform technique for staging content this way: Data Manipulation
          (T1565) lists Windows, Linux and macOS only.
        MICROSOFT.SQL/SERVERS/DATABASES/IMPORT/ACTION: >-
          The database-scoped spelling of the import above.
        MICROSOFT.SQL/SERVERS/DATABASES/EXTENSIONS/WRITE: >-
          The newer API surface behind import and export. It carries both
          directions in one operation name, so a detection on it cannot say which
          happened; the dedicated export action is mapped instead.
        MICROSOFT.SQL/SERVERS/DATABASES/MOVE/ACTION: >-
          Renames a database. Disruptive to whatever connects by name and
          reversible in one call.
        MICROSOFT.SQL/SERVERS/DATABASES/RESUME/ACTION: >-
          Brings a paused database back online. The pause is mapped.
        MICROSOFT.SQL/SERVERS/DATABASES/RESTOREPOINTS/ACTION: >-
          Creates a restore point, which adds a recovery option. Deleting one is
          mapped under T1490.
        MICROSOFT.SQL/SERVERS/DATABASES/UPGRADEDATAWAREHOUSE/ACTION: >-
          A platform version upgrade for a data warehouse.
        MICROSOFT.SQL/SERVERS/DATABASES/MAINTENANCEWINDOWS/WRITE: >-
          Chooses when Azure may patch the database. It shifts a maintenance
          schedule and grants nothing.
        MICROSOFT.SQL/SERVERS/DATABASES/GETCURRENTAVAILABILITYZONE/ACTION: >-
          Returns which availability zone a database sits in. A read dressed as an
          action.
        MICROSOFT.SQL/SERVERS/DATABASES/OPERATIONS/CANCEL/ACTION: >-
          Cancels a long-running database operation that has not finished.
        MICROSOFT.SQL/SERVERS/ELASTICPOOLS/OPERATIONS/CANCEL/ACTION: >-
          The elastic pool version of the cancel above.
        # Server communication links. A link lets one logical server run elastic
        # queries against another, which is a lateral path in principle. Both
        # servers must already be in the tenant and the caller must already hold
        # write on this one, so the link adds no access the caller did not have.
        # Trusted Relationship (T1199) is about a third party and does not fit.
        MICROSOFT.SQL/SERVERS/COMMUNICATIONLINKS/WRITE: >-
          Creates a cross-server query link inside the tenant. Legacy elastic
          query plumbing between two servers the caller can already reach.
        MICROSOFT.SQL/SERVERS/COMMUNICATIONLINKS/DELETE: >-
          Removes such a link.
        MICROSOFT.SQL/SERVERS/REFRESHEXTERNALGOVERNANCESTATUS/ACTION: >-
          Re-reads whether an external governance product such as Purview is
          enabled. A status refresh that changes nothing on the server.
      Microsoft.Web/sites:
        # A deployment slot is a live copy of the app with the same operations, so
        # every slot operation takes the same verdict as its site twin and points
        # at that entry for the reason. The comments below group the site half.
        # ── Backups: reading, listing and restoring one ─────────────────────────────
        MICROSOFT.WEB/SITES/BACKUPS/ACTION: >-
          Discovers an existing backup in a storage container so it can be restored.
          A lookup that changes nothing.
        MICROSOFT.WEB/SITES/BACKUPS/LIST/ACTION: >-
          Lists the backups that exist. The backup configuration, which names the
          destination container, is mapped under T1537.
        MICROSOFT.WEB/SITES/BACKUPS/RESTORE/ACTION: >-
          Restores the app from one of its own backups. Recovery, and the caller-
          named blob restore is what is mapped under T1651.
        # ── Configuration teardown. The write directions are mapped; removing a
        # setting breaks the app rather than granting anything.
        MICROSOFT.WEB/SITES/CONFIG/DELETE: >-
          Removes a configuration section. Destructive to the running app and it
          grants nothing; the config write, which carries the startup command and
          the IP restrictions, is mapped twice.
        MICROSOFT.WEB/SITES/CONFIG/WEB/APPSETTINGS/DELETE: >-
          Removes one app setting. The write direction is what plants a value the
          runtime acts on.
        MICROSOFT.WEB/SITES/CONFIG/WEB/CONNECTIONSTRINGS/DELETE: >-
          Removes one connection string. Breaks the app's link to its backing store;
          the write is mapped under T1098.001.
        # ── Diagnostics and logs. These read the app's own output. Application logs
        # can carry tokens that were logged by mistake, which is a real risk and not
        # one the operation name can establish -- the credential surfaces Azure
        # itself labels as secrets are mapped under T1552 instead.
        MICROSOFT.WEB/SITES/CONTAINERLOGS/ACTION: >-
          Packages the container's logs for download. Logs may contain whatever the
          application wrote to them, which is the application's fault rather than
          this operation's.
        MICROSOFT.WEB/SITES/CONTAINERLOGS/DOWNLOAD/ACTION: >-
          Downloads the log package the operation above produced.
        MICROSOFT.WEB/SITES/CONTINUOUSWEBJOBS/DELETE: >-
          Removes a continuous WebJob. Starting one is what persists execution and
          is mapped under T1546.
        MICROSOFT.WEB/SITES/DIAGNOSTICS/ANALYSES/EXECUTE/ACTION: >-
          Runs one of Azure's own diagnostic analyses against the app.
        MICROSOFT.WEB/SITES/DIAGNOSTICS/DETECTORS/EXECUTE/ACTION: >-
          Runs one of Azure's own diagnostic detectors.
        MICROSOFT.WEB/SITES/DOMAINOWNERSHIPIDENTIFIERS/DELETE: >-
          Removes such an identifier.
        MICROSOFT.WEB/SITES/DOMAINOWNERSHIPIDENTIFIERS/WRITE: >-
          Records the identifier used to prove ownership of a domain. Half of a
          verification handshake with public DNS.
        MICROSOFT.WEB/SITES/EVENTGRIDFILTERS/DELETE: >-
          Removes an Event Grid filter. Creating one arranges for the app to be
          invoked and is mapped under T1546.
        # ── Feature teardown. Each is the removal half of an operation mapped above.
        MICROSOFT.WEB/SITES/EXTENSIONS/DELETE: >-
          Removes a site extension. The write, which installs code into the app's
          own process, is mapped under T1651.
        MICROSOFT.WEB/SITES/FUNCTIONS/DELETE: >-
          Removes a function. Destroys the workload's code and grants nothing; the
          function write is mapped under T1651.
        # ── Key revocation. Creating keys is mapped under T1098.001; deleting one
        # takes access away rather than granting it.
        MICROSOFT.WEB/SITES/FUNCTIONS/KEYS/DELETE: >-
          Revokes a function key. The write, which mints one, is mapped.
        MICROSOFT.WEB/SITES/HOST/FUNCTIONKEYS/DELETE: >-
          Revokes a host-level function key.
        MICROSOFT.WEB/SITES/HOST/LISTSYNCSTATUS/ACTION: >-
