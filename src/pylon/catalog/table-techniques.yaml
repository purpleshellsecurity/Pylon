    # The rules the rejections below cite. Each one is a judgment about a WHOLE
    # class of activity, written once so it can be argued with once.
    rejection_rules:
      R-b2c-resource: >-
        Creating, updating or deleting the AZURE RESOURCE behind a B2C or CIAM
        tenant, through the Microsoft.AzureActiveDirectory resource provider. This
        is subscription and resource-group plumbing -- linking a tenant to a
        subscription, moving it between resource groups, checking a name is free.

        The identity configuration INSIDE such a tenant is a different surface and
        is not covered by this rule: custom policies, policy keys, identity
        providers and API connectors are each judged on their own.
      R-branding: >-
        Presentation. Company branding, localized resources, page contracts,
        supported cultures, sign-in page layout. Changing how a sign-in page LOOKS
        is a real step in a credential-phishing setup, and it is rejected because
        Entra logs the same activity for every ordinary branding change and the
        operation name carries nothing that separates the two.
      R-bulk-status: >-
        A status row for a bulk job, not the change itself. These carry the job's
        outcome and no target, so a detection on one can say a bulk operation
        finished and cannot say what it did or to whom.

        The bulk jobs whose EFFECT is destructive are mapped separately, on the
        row that names the effect.
      R-defender-action: >-
        Something a defender or the platform did in response to a threat: an
        administrator confirming an account IS compromised, a user reporting
        fraud, a device being marked non-compliant.

        The opposite direction is not covered by this rule and is mapped.
        Dismissing a risk, marking an account safe when it is not, and clearing a
        detection are how an attacker quiets Identity Protection, and those are
        under T1562.
      R-lifecycle-admin: >-
        Ordinary directory administration that grants no access and destroys no
        data: licence assignment, group expiry policy, recommendation dismissal,
        maintenance of a workflow's schedule, tenant metadata.
      R-notification: >-
        Records that a message was sent or a notice was raised, not that anything
        changed. An email, an Event Grid notification, an expiry warning, a PIM
        alert being triggered or refreshed.
      R-provisioning: >-
        Application provisioning and directory synchronisation job mechanics -- a
        job starting, running, pausing, restarting or reporting an error. These
        describe the sync engine's own operation. The settings that decide WHAT it
        syncs and under which credential are a different surface and are judged
        separately.
      R-read: >-
        AuditLogs is a record of CHANGES. These activities read configuration and
        alter nothing, and they are in the reference at all because Microsoft's
        page documents the whole Azure AD B2C and CIAM management API alongside
        the directory itself.

        Reads that DO matter are mapped individually and are not covered by this
        rule: reading a BitLocker recovery key, recovering a device local
        administrator password, and retrieving the key material behind a B2C
        policy are credential access, not configuration browsing.
      R-self-service: >-
        A user acting on their own account through a flow the tenant has
        deliberately enabled: changing their own password, completing a sign-up,
        accepting terms of use, renewing their own group.

        Self-service security-info registration is NOT covered by this rule and is
        mapped, because enrolling a new authentication method on an account is how
        a stolen password becomes durable access.
      R-token-issuance: >-
        One row per authentication. Azure AD B2C writes an activity when it issues
        an access token, an ID token, an authorization code or a SAML assertion,
        and again when it validates a credential.

        These are sign-ins. They belong in SigninLogs, which carries the location,
        the device, the risk score and the conditional access result that make a
        sign-in worth looking at -- none of which is on this row. Watching them
        here means the highest-volume events in the tenant burying every directory
        change on the same table.
      R-undo: >-
        The restoring direction of an act that is itself mapped. Re-enabling an
        account, restoring a deleted object, clearing a block, releasing a hold.
        An attacker who runs one of these is putting something back, and the
        destructive direction is where the detection belongs.

        Restores are not free of risk -- restoring a soft-deleted service
        principal brings its credentials back with it -- but the operation cannot
        be told from an administrator undoing a mistake, which is what it is used
        for almost every time.
      R-workflow: >-
        Request and approval bookkeeping around an act that is mapped in its
        completed form. Entra writes a row when a PIM assignment is REQUESTED,
        another when it is approved or denied, another when it is cancelled,
        another when it expires, and another when it actually completes.

        Only the completion changes access, and it is the completion that is
        mapped. Watching the request rows means alerting on intent that may never
        have been granted, and alerting several times for one grant that was.
      R-workflow-run: >-
        A lifecycle workflow starting, finishing or being scheduled. The run tells
        you the automation executed; it does not say what the automation DOES.

        What it does is decided when the workflow and its tasks are written, and
        those operations are mapped -- a workflow can disable accounts, remove
        group memberships and call an external endpoint on a schedule.
