  # ── Key Vault ───────────────────────────────────────────────────────────────
  AZKVAuditLogs:
    platform: IaaS
    plane: data
    note: >-
      Every one of the vault's 78 data-plane operations is accounted for: 51 are mapped
      to the techniques here, and 27 are recorded under `rejected` in the catalogue as
      considered and turned down, each with its reason. So an operation in neither half
      is a harvesting fault rather than a judgment that it does not matter.
    techniques:
      - id: T1555.006
        # Cloud Secrets Management Stores
        operations:
          - SecretGet
          - SecretList
          - SecretBackup
          - KeyGet
          - KeyList
          - KeyBackup
          - KeyDecrypt
          - KeyUnwrap
          - CertificateGet
          - CertificateList
          - SecretListVersions
          - SecretGetDeleted
          - SecretListDeleted
          - KeyListVersions
          - KeyGetDeleted
          - KeyListDeleted
          - CertificateListVersions
          - CertificateBackup
          - CertificateGetDeleted
          - CertificateListDeleted
        basis: >-
          Reads, lists and backups of vault material, including the soft-deleted
          copies. KeyDecrypt and KeyUnwrap are here because they are the USE of a key
          to recover protected plaintext, which is the same outcome as reading the
          key. CertificateBackup exports the private key with the cert.
      - id: T1485
        # Data Destruction
        operations:
          - SecretDelete
          - SecretPurge
          - KeyDelete
          - KeyPurge
          - CertificateDelete
          - VaultDelete
          - CertificatePurge
        basis: >-
          Delete and purge destroy the material irrecoverably once purged. VaultDelete
          takes every object with it.
      - id: T1098.001
        # Additional Cloud Credentials
        operations:
          - SecretSet
          - SecretRestore
          - KeyImport
          - KeyRestore
          - CertificateImport
          - CertificateRestore
          - CertificatePendingMerge
        basis: >-
          Writing material INTO the vault: a planted secret, an imported key or
          certificate, or a restore from an attacker-supplied backup blob. The
          credential the victim then uses is the attacker's. CertificatePendingMerge
          belongs here because it COMPLETES an issuance: a usable certificate exists
          in the vault afterwards that did not before.
      - id: T1556
        # Modify Authentication Process
        operations:
          - CertificatePolicyUpdate
          - CertificatePolicySet
          - CertificateIssuerSet
          - CertificateIssuerUpdate
          - CertificatePendingUpdate
        basis: >-
          Certificate issuance configuration. Setting an issuer or rewriting an
          issuance policy changes the process that mints certificates the environment
          already trusts, and never touches a secret. These four were first mapped to
          T1553 (Subvert Trust Controls), which is wrong on a fact rather than a
          judgment: ATT&CK lists T1553 for Linux, Windows and macOS only, with no
          cloud platform at all. CertificatePendingUpdate joins them on review: it
          drives the request the issuance process acts on, and calling that routine
          assumed an external issuer decides what may be issued -- an assumption
          that does a lot of work and is not always true.
      - id: T1098
        # Account Manipulation
        operations:
          - VaultPut
          - VaultPatch
          - VaultAccessPolicyChangedEventGridNotification
        basis: >-
          An access policy change grants a principal vault access under the legacy
          permission model. It is logged three ways: VaultPut and VaultPatch carry the
          rewritten policy, and Microsoft publishes the notification whether or not an
          Event Grid subscription exists, which makes it the one anchor that needs
          nothing configured.
      - id: T1486
        # Data Encrypted for Impact
        operations:
          - KeyEncrypt
          - KeyWrap
        basis: >-
          Encrypt and wrap against a customer-managed key is the Key Vault side of
          cloud ransomware.
      - id: T1078.004
        # Cloud Accounts
        operations:
          - Authentication
        basis: >-
          Data-plane authentication identifies which principal reached the vault.
      - id: T1550
        # Use Alternate Authentication Material
        operations:
          - KeySign
        basis: >-
          Signing with a vault key produces authentication material the attacker did
          not have to steal outright.
      - id: T1562
        # Impair Defenses
        operations:
          - KeyRotationPolicySet
          - CertificateContactsSet
          - CertificateContactsDelete
        basis: >-
          Rewriting a key's rotation policy is how rotation stops quietly. Nothing
          fails; the key simply stays valid. The two certificate-contact writes are the
          same shape: that list is who Key Vault emails when a certificate nears expiry,
          so deleting it removes the notice and overwriting it sends the notice
          somewhere the owner does not read. Set is the quieter of the two, because a
          list that has been redirected still exists and still looks configured. All
          three were first rejected as availability nuisances, which reads the
          disruption and misses the evasion.
      - id: T1526
        # Cloud Service Discovery
        operations:
          - CertificateIssuersList
          - KeyVerify
        basis: >-
          Reading how the vault is configured to issue, rather than reading what it
          holds. Listing the issuers is the step before rewriting one, and it is the
          only place that sequence shows. KeyVerify is the weaker of the two and is
          here on that argument alone: it returns no key material, but a caller
          holding only verify permission can use it to confirm which keys exist and
          are enabled. Noisy on its own; worth having when it precedes a write.
    # Considered and deliberately not mapped. The reason is the point: it is what
    # stops this being re-litigated, and what a reviewer argues with.
    rejected:
      SecretRecover: >-
        Recovery of a soft-deleted secret. The subsequent read is what matters and is
        already mapped.
      KeyCreate: >-
        Creating a key is ordinary provisioning and gives the creator nothing they did
        not already have.
      KeyRecover: >-
        Recovery of a soft-deleted key. The read that follows is the signal and is
        already mapped.
      CertificateCreate: >-
        Ordinary issuance through an already-configured issuer. The issuer configuration
        is the decision worth watching, and it is mapped.
      VaultGet: >-
        Read of the vault's own configuration. Every portal view and ARM client issues
        it; the volume makes it useless alone.
      VaultRecover: >-
        Undeleting a vault is an administrator action, and the material it restores is
        already covered by the read operations.
      SecretUpdate: >-
        Changes a secret's attributes, not its value. Disabling one is an availability
        nuisance, not access.
      SecretNearExpiryEventGridNotification: >-
        Service-generated lifecycle event. No actor performed it.
      SecretExpiredEventGridNotification: >-
        Service-generated lifecycle event.
      KeyUpdate: >-
        Changes a key's attributes, not the key material. Disabling one is an
        availability nuisance, not access.
      KeyRotate: >-
        On-demand rotation is normal operations, and the old key stays available for
        decryption.
      KeyRotateIfDue: >-
        Service-scheduled rotation against the key's own policy. No actor.
      KeyRotationPolicyGet: >-
        Reading a rotation policy reveals when a key is due to change. That is
        scheduling detail, not access to the key itself.
      KeyNearExpiryEventGridNotification: >-
        Service-generated lifecycle event.
      KeyExpiredEventGridNotification: >-
        Service-generated lifecycle event.
      CertificateUpdate: >-
        Changes the certificate's attributes, not the certificate or its private key.
        Disabling one is an availability nuisance.
      CertificateRecover: >-
        Recovery of a soft-deleted certificate. The read that follows is the signal and
        is already mapped.
      CertificatePolicyGet: >-
        Read of an issuance policy. Rewriting one is mapped; reading it is ordinary
        certificate management.
      CertificateContactsGet: >-
        Read of the list of addresses notified about expiry. It exposes no vault
        material.
      CertificateIssuerGet: >-
        Read of issuer configuration. Setting or updating an issuer is mapped; reading
        it is not.
      CertificateIssuerDelete: >-
        Removing an issuer breaks future issuance. Disruptive, not access.
      CertificateEnroll: >-
        Enrolment with an already-configured issuer. The issuer configuration is the
        decision worth watching.
      CertificateRenew: >-
        Renewal of a certificate that already exists and is already trusted.
      CertificatePendingGet: >-
        Read of an in-flight certificate request. The certificate does not exist yet, so
        there is nothing to take. This holds only while an external issuer decides what
        may be issued; the two request operations that DRIVE that decision are mapped.
      CertificatePendingDelete: >-
        Abandons an in-flight issuance request. Nothing is issued and nothing is read, so
        the worst case is a certificate that does not arrive.
      CertificateNearExpiryEventGridNotification: >-
        Service-generated lifecycle event.
      CertificateExpiredEventGridNotification: >-
        Service-generated lifecycle event.

  # ── Storage ─────────────────────────────────────────────────────────────────
  StorageBlobLogs:
    platform: IaaS
    plane: data
    # Every operation Microsoft publishes for this table, mapped or rejected.
    # The list is theirs, not ours: the blob monitoring reference names Storage
    # Analytics Logged Operations and Status Messages as the complete set of
    # operationName values, and that page carries 54 Blob service operations plus
    # 22 Data Lake Storage Gen2 ones. Both land here -- a storage account with a
    # hierarchical namespace writes ReadFile and SetPathAccessControl to
    # StorageBlobLogs, not to a table of its own -- so a tenant running a data
    # lake sees names no blob-only list has ever heard of.
    techniques:
      - id: T1530
        operations:
          - GetBlob
          - GetBlobProperties
          - QueryBlobContents
          - ReadFile
        basis: >-
          The blob's contents leaving. GetBlob is the download; QueryBlobContents
          runs a SQL query over the blob and returns rows, which reads the data
          without ever fetching the whole object.

          ReadFile is the same act through the Data Lake Storage Gen2 endpoint. A
          storage account with a hierarchical namespace writes that name and never
          GetBlob, so a rule that watches only GetBlob is blind on a data lake.
      - id: T1552.001
        operations:
          - GetBlob
          - ReadFile
        basis: >-
          Separated from the read above because the objective differs. A blob is
          where deployment scripts, terraform state, .env files and connection
          strings end up, and reading one of those is a credential access, not a
          data theft.

          The sharpest case is a function app's own storage account. Microsoft
          documents it plainly: "By default, the AzureWebJobsStorage setting stores
          keys in a Blob storage container in the provided account", and the master
          key "grants administrative, data-plane access to your app -- including, on
          apps with a writable file system, the ability to deploy and run code
          through the runtime REST APIs".

          So a blob read against that container ends in code execution on a
          DIFFERENT service, and it issues none of the ARM operations that look like
          a key retrieval. A tenant watching only Microsoft.Web listkeys sees
          nothing. Every function app has such a storage account, and it is usually
          treated as plumbing rather than as a secret store.

          Nothing in the operation name distinguishes any of this. The blob's PATH
          does, so a detection here has to filter on the URI.
      - id: T1619
        operations:
          - FindBlobsByTags
          - GetBlobMetadata
          - GetBlobTags
          - GetBlockList
          - GetContainerMetadata
          - GetContainerProperties
          - GetPageRanges
          - ListBlobs
          - ListContainers
          - ListFilesystems
          - GetFilesystemProperties
          - ListFilesystemDir
          - ListFilesystemFile
          - GetFileProperties
          - GetPathStatus
        basis: >-
          Finding out what is stored before taking it. Listing containers and blobs
          is the obvious form; FindBlobsByTags is the quiet one, because it searches
          across containers by index tag and does not need the container names.

          Metadata, tags, properties, block lists and page ranges are here rather
          than under the read above: they describe the object without returning its
          contents. Page ranges are worth naming on their own, since on a page blob
          they map the used regions of a virtual disk.

          The Data Lake Storage Gen2 names are the same act on a hierarchical
          namespace.
      - id: T1069
        operations:
          - GetContainerACL
          - GetPathAccessControl
        basis: >-
          Reading who can reach the data. A container ACL says whether the container
          is anonymously readable and what stored access policies exist, and a Data
          Lake access control list says which principals hold which POSIX
          permissions.

          Both are the reconnaissance step before the write that follows, and the
          write is mapped under T1098.
      - id: T1537
        operations:
          - CopyBlob
          - CopyBlobSource
          - CopyBlobDestination
          - IncrementalCopyBlob
          - PutBlockFromURL
        basis: >-
          A copy to a destination the caller names. CopyBlob takes a destination
          account that does not have to belong to the tenant, and
          IncrementalCopyBlob is the version that keeps itself up to date.

          CopyBlobSource and CopyBlobDestination are Azure's own halves of a copy
          and appear only in logging data. They are mapped rather than rejected
          because a copy between accounts is logged in BOTH accounts, and the
          destination account is often the only one the defender does not own.

          PutBlockFromURL writes content pulled from a URL the caller supplies,
          which is the same movement in the other direction.
      - id: T1098
        operations:
          - SetContainerACL
          - SetPathAccessControl
        basis: >-
          The write that changes who can reach the data. SetContainerACL sets the
          public access level, and setting it to Blob or Container makes the data
          readable by anyone on the internet with the URL, with no credential of any
          kind. It also carries the stored access policies that shared access
          signatures are issued against.

          ATT&CK's technique for permission changes, T1222, lists Windows, Linux,
          macOS and ESXi with no cloud platform, so it cannot be used here. Account
          Manipulation is the nearest available reading and it is the same one this
          catalogue already uses for Key Vault access policies.
      - id: T1098.001
        operations:
          - GetUserDelegationKey
        basis: >-
          Returns the key that signs a user-delegation shared access signature. The
          caller can then mint SAS tokens for the account, and those tokens outlive
          the session that made them and carry no user identity of their own.

          Rare in ordinary traffic and easy to miss, because it reads as a key
          retrieval rather than as a credential being created.
      - id: T1562.008
        operations:
          - SetBlobServiceProperties
        basis: >-
          Storage Analytics logging is configured through the service properties,
          and this operation is the write that turns it off. Every other mapping on
          this table assumes StorageBlobLogs is receiving data; this is how that
          assumption is made false.
      - id: T1485
        operations:
          - ClearPage
          - DeleteBlob
          - DeleteContainer
          - SetBlobExpiry
          - DeleteFilesystem
          - DeleteFile
          - DeleteDirectory
        basis: >-
          Data gone. The deletes are the obvious half; the other two are not.

          ClearPage zeroes a range of a page blob, so the data in that range is gone
          with no delete ever issued. SetBlobExpiry schedules the blob's own
          deletion, which destroys it later and without the attacker present.
      - id: T1486
        operations:
          - AppendBlock
          - PutBlob
          - PutBlock
          - PutBlockList
          - PutPage
          - CreatePathFile
          - AppendFile
          - FlushFile
        basis: >-
          Overwriting a blob in place. This is what cloud ransomware looks like:
          read the blob, encrypt it, write it back. No operation name says
          "encrypt", so the signal is the PATTERN -- a read followed by a write of
          the same blob, repeated across a container by one principal.

          Every path is here because they are interchangeable. A block blob can be
          replaced through PutBlob or through staged PutBlock calls committed with
          PutBlockList; a page blob through PutPage; an append blob through
          AppendBlock; and a Data Lake file through CreatePathFile, AppendFile and
          FlushFile.

          Noisy on its own. Uploads are what storage accounts are for, so this is
          worth a rule only as a rate or as a read-then-write pair.
      - id: T1486
        operations:
          - AcquireBlobLease
          - AcquireContainerLease
          - ChangeBlobLease
          - ChangeContainerLease
          - SetBlobTier
          - LeaseFile
        basis: >-
          Denial of access to stored data WITHOUT encrypting anything, kept separate
          from the overwrite above because it is a different act with the same
          objective.

          A lease locks a blob against every other writer and its duration can be
          infinite, so an attacker who leases a container's blobs has taken them
          away from the owner without touching a byte. Changing a lease ID locks out
          whoever held the old one. Setting the Archive tier does the same thing by
          another route: the blob stays where it is and becomes unreadable until it
          is rehydrated, which takes hours.

          The mapping is a judgment and it is stated rather than hidden. ATT&CK's
          Data Encrypted for Impact is about encryption, and nothing here encrypts.
          It is used because the objective is the same and no cloud technique names
          this act. Tier changes in particular are constant wherever lifecycle
          management is on, so a detection needs a rate or a scope, not the
          operation name alone.
    rejected:
      # Blob service REST API
      AbortCopyBlob: >-
        Stops a copy rather than starting one. The copy operations are mapped
        under T1537.
      BreakBlobLease: >-
        Ends a lease. Taking one is the denial act and is mapped; breaking one is
        how an owner recovers from it.
      BreakContainerLease: >-
        The container form of the lease break above, and the same judgment.
      CreateContainer: >-
        Creating storage is the ordinary act. What makes a container dangerous is
        its access policy, and that is a separate operation which is mapped.
      GetAccountInformation: >-
        Returns the storage tier and account kind. It names no container and no
        blob, so it reveals nothing about what is stored.
      GetBlobServiceStats: >-
        Reports how far behind the secondary region is. An availability read.
      GetBlobLeaseInfo: >-
        A read of the lease state, which changes nothing.
      RenewBlobLease: >-
        Upkeep of a lease already taken. The acquire is what is mapped, and
        renewals of a legitimate lease run constantly.
      RenewContainerLease: >-
        The container form of the renewal above.
      ReleaseBlobLease: >-
        Releases the lock. The recovering direction.
      ReleaseContainerLease: >-
        The container form of the release above.
      SetBlobMetadata: >-
        Arbitrary key-value pairs attached to a blob. They are not read by the
        service and change no access.
      SetBlobTags: >-
        Index tags feed the blob index and lifecycle rules. Rewriting them can
        move a blob out of a rule's scope, which is indirect and unreliable as a
        signal.
      SetBlobProperties: >-
        HTTP response headers for the blob. Changing them alters how a browser
        renders it and grants nothing.
      SetContainerMetadata: >-
        The container form of the metadata write above.
      SnapshotBlob: >-
        Adds a point-in-time copy, which is a recovery option rather than a loss
        of one.
      UndeleteBlob: >-
        Restores data. The delete it undoes is mapped under T1485.
      GetBlobServiceProperties: >-
        Reads the logging configuration rather than changing it. The write, which
        is how logging is turned off, is mapped under T1562.008.
      BlobPreflightRequest: >-
        A browser asking whether a cross-origin request is allowed. Issued by the
        browser, not by the caller, and it carries no identity.
      # Data Lake Storage Gen2 REST API
      CreateFilesystem: >-
        The hierarchical-namespace form of creating a container, and the same
        judgment.
      SetFilesystemProperties: >-
        Filesystem-level metadata. The access control list is the permission
        surface here and it is mapped separately.
      CreatePathDir: >-
        Creates an empty directory. It holds no data and grants no access.
      SetFileProperties: >-
        The hierarchical-namespace form of the blob property write above.
      RenamePathFile: >-
        Moves a file within the same filesystem. The data does not leave and
        nothing is destroyed, though it does break paths that other systems depend
        on.
      RenamePathDir: >-
        The directory form of the rename above.
  StorageFileLogs:
    platform: IaaS
    plane: data
    # Every operation Microsoft publishes for this table, mapped or rejected: 50
    # File service REST operations and 19 SMB ones.
    #
    # The SMB half matters more than its size suggests. Azure Files is normally
    # MOUNTED, and a mounted share writes Read, Write and SetInfo -- never GetFile
    # or DeleteFile. A rule written against the REST names alone is silent on the
    # way the service is actually used.
    techniques:
      - id: T1530
        operations:
          - GetFile
          - Read
        basis: >-
          The file's contents leaving. Read is the SMB form and GetFile is the REST
          one, and on a mounted share only Read ever appears.
      - id: T1552.001
        operations:
          - GetFile
          - Read
        basis: >-
          Separated from the read above because the objective differs. File shares
          are where scripts, configuration files and saved credentials live, and
          reading one of those is a credential access rather than a data theft. The
          operation name cannot tell them apart; the path can, so a detection here
          has to filter on it.
      - id: T1552
        operations:
          - GetEncryptionKey
        basis: >-
          Retrieves an encryption key for the share. Mapped on the strength of what
          it is: a key leaving the service to a caller. Microsoft publishes the
          operation name and little else about it, which is stated here rather than
          dressed up.
      - id: T1619
        operations:
          - GetFileProperties
          - GetDirectoryMetadata
          - GetDirectoryProperties
          - GetFileMetadata
          - GetShareMetadata
          - GetShareProperties
          - ListFileRanges
          - ListFiles
          - ListFileSnapshots
          - ListHandles
          - ListShares
          - QueryDirectory
          - QueryInfo
        basis: >-
          Finding out what is on the share before taking it. QueryDirectory is the
          SMB enumeration and ListFiles the REST one.

          ListHandles is the sharpest and the least obvious: it reports every open
          SMB handle on the share, which tells the caller who is connected and to
          which files. That is reconnaissance of the share's USERS, not just its
          contents.
      - id: T1069
        operations:
          - GetFilePermission
          - GetShareAcl
        basis: >-
          Reading who can reach the share. A share ACL holds the stored access
          policies that shared access signatures are issued against, and a file
          permission is the Windows security descriptor applied to files and
          directories.
      - id: T1537
        operations:
          - CopyFile
          - CopyFileDestination
          - CopyFileSource
          - PutRangeFromURL
        basis: >-
          A copy to a destination the caller names. CopyFile takes a source URL that
          may point outside the tenant, and PutRangeFromURL writes content pulled
          from one. CopyFileSource and CopyFileDestination are Azure's own halves of
          a copy and appear only in logging data.
      - id: T1098
        operations:
          - PutFilePermission
          - SetShareAcl
        basis: >-
          The write that changes who can reach the share. SetShareAcl rewrites the
          stored access policies that shared access signatures are issued against,
          and PutFilePermission stores a Windows security descriptor that is then
          applied to files and directories.

          ATT&CK's technique for permission changes, T1222, lists no cloud platform,
          so Account Manipulation is the nearest available reading -- the same one
          this catalogue uses for Key Vault access policies and for container ACLs.
      - id: T1562.008
        operations:
          - SetFileServiceProperties
        basis: >-
          Storage Analytics logging for the File service is configured through the
          service properties, and this operation is the write that turns it off.
      - id: T1485
        operations:
          - ClearRange
          - DeleteDirectory
          - DeleteFile
          - DeleteShare
          - SetInfo
        basis: >-
          Data gone. ClearRange zeroes part of a file, so that data is gone with no
          delete issued.

          SetInfo is the one to understand. On SMB it sets file attributes AND
          carries the rename and the delete-on-close disposition, so on a mounted
          share SetInfo IS the delete. A rule watching only DeleteFile never fires
          on a mounted share.
      - id: T1486
        operations:
          - CreateFile
          - PutRange
          - Write
        basis: >-
          Overwriting a file in place, which is what ransomware on a mounted share
          looks like: read, encrypt, write back. Write is the SMB form, PutRange the
          REST one, and CreateFile truncates an existing file of the same name.

          The signal is the pattern rather than the name -- a read followed by a
          write of the same path, repeated across a share by one principal.
      - id: T1486
        operations:
          - AcquireFileLease
          - ChangeFileLease
        basis: >-
          Denial of access without encrypting anything, kept separate from the
          overwrite above. A file lease blocks every other writer and can be
          infinite; changing the lease ID locks out whoever held the old one.

          The mapping is a judgment and it is stated rather than hidden: nothing
          here encrypts, and ATT&CK has no cloud technique for locking stored data
          away from its owner.
    rejected:
      # File service REST API
      AbortCopyFile: >-
        Stops a copy rather than starting one. The copy operations are mapped
        under T1537.
      BreakFileLease: >-
        Ends a lease. Taking one is the denial act and is mapped; breaking one is
        how an owner recovers from it.
      ListFilesystemDir: >-
        A Data Lake Storage Gen2 operation that Microsoft's own table lists under
        the File service as well as under Data Lake. It is mapped under T1619 in
        StorageBlobLogs, which is where Data Lake traffic is actually logged; the
        entry here is kept because the published list has it.
      CreateDirectory: >-
        Creates an empty directory. It holds no data and grants no access.
      CreateFileSnapshot: >-
        Adds a point-in-time copy, which is a recovery option rather than a loss
        of one.
      CreateShare: >-
        Creating storage is the ordinary act. What makes a share reachable is its
        access policy, which is a separate operation and is mapped.
      FilePreflightRequest: >-
        A browser asking whether a cross-origin request is allowed. Issued by the
        browser, not by the caller, and it carries no identity.
      FileSessionConnect: >-
        The service-side record of a session opening. SessionSetup and TreeConnect
        are the SMB operations for the same act and are rejected for the same
        reason.
      GetFileCopyInformation: >-
        Progress of a copy already started. The copy is mapped.
      GetFileServiceProperties: >-
        Reads the logging configuration rather than changing it. The write, which
        is how logging is turned off, is mapped under T1562.008.
      GetFileShareUniqueId: >-
        An internal identifier used by the service. It reveals nothing about the
        share's contents or access.
      GetPostMigrationFileInfo: >-
        Migration bookkeeping issued by Azure's own tooling.
      GetShareStats: >-
        A capacity figure. It names no file.
      ReleaseFileLease: >-
        Releases the lock. The recovering direction.
      SetDirectoryMetadata: >-
        The directory form of the metadata write above.
      SetFileMetadata: >-
        Arbitrary key-value pairs attached to a file. They are not read by the
        service and change no access.
      SetFileProperties: >-
        HTTP response headers and SMB attributes for the file. They change how it
        is presented, not who can reach it.
      SetShareMetadata: >-
        The share form of the metadata write above.
      SetShareProperties: >-
        Share quota and tier. Shrinking a quota can stop writes, which is a slow
        and indirect denial that ordinary capacity management is indistinguishable
        from.
      SnapshotShare: >-
        The share form of the snapshot above, and the same judgment.
      # File service SMB API
      Cancel: >-
        Cancels a request already in flight.
      ChangeNotify: >-
        A subscription to directory changes. It reads no file content.
      Close: >-
        Closes a handle. It follows every open and carries no separate act.
      Create: >-
        Every SMB operation begins with a handle open, so this fires on reads,
        writes and directory listings alike. Watching it means watching all share
        traffic; the acts it precedes are mapped individually.
      Echo: >-
        A keep-alive ping that touches no data.
      Flush: >-
        Commits data the write already sent. The write is mapped.
      Ioctl: >-
        A family of control codes rather than one act. The code is not in the
        operation name, so a detection on it cannot say what was asked for.
      Lock: >-
        Locks part of a file against other writers. A denial in principle, and
        applications take byte-range locks constantly in normal operation, so the
        operation name cannot tell the two apart.
      Logoff: >-
        Ends an SMB session. The teardown half of a sign-in, and the sign-in
        itself is rejected above.
      Negotiate: >-
        The first message of every SMB connection, before any identity is
        established.
      OplockBreak: >-
        Cache coherency machinery the server initiates, not the client.
      SessionSetup: >-
        Authentication to the share. Sign-in signals for storage belong in the
        identity tables, and this fires on every mount and every reconnect.
      TreeConnect: >-
        Mounting a share. Every client that uses Azure Files issues this on every
        reconnect, and it names no file.
      TreeDisconnect: >-
        Unmounts a share. The teardown half of a mount, and the mount itself is
        rejected above.
  StorageQueueLogs:
    platform: IaaS
    plane: data
    # Every operation Microsoft publishes for this table, mapped or rejected.
    techniques:
      - id: T1530
        operations:
          - GetMessage
          - GetMessageWrite
          - GetMessageRead
          - GetMessages
          - PeekMessage
          - PeekMessages
        basis: >-
          The message bodies leaving. A queue carries whatever the application puts
          in it, which in practice includes order details, document identifiers,
          tokens and connection strings.

          Peek is the one worth separating in a detection even though it shares this
          technique. Dequeuing hides a message from the real consumer and something
          downstream breaks; peeking returns the same bodies and leaves the queue
          working exactly as before, so nothing looks wrong.

          GetMessageRead and GetMessageWrite are Azure's own names for a Get Message
          call that found nothing and one that found something. They appear only in
          logging data, and a rule that watches GetMessage alone misses both.
      - id: T1619
        operations:
          - GetQueueMetadata
          - GetQueue
          - ListQueues
        basis: >-
          Finding out what queues exist and how much is in them before reading. The
          metadata read carries the approximate message count, which is how a caller
          picks the queue worth taking.
      - id: T1562.008
        operations:
          - SetQueueServiceProperties
        basis: >-
          Storage Analytics logging for the Queue service is configured through the
          service properties, and this operation is the write that turns it off.
      - id: T1485
        operations:
          - ClearMessages
          - DeleteQueue
          - DeleteMessage
        basis: >-
          Messages gone. ClearMessages empties a queue in one call and DeleteQueue
          takes the queue with it, so work the application was going to do is simply
          lost.

          DeleteMessage is here too and is by far the noisiest of the three:
          deleting a message after processing it is the normal end of every queue
          transaction, so it is worth a rule only at a rate no consumer would
          produce.
    rejected:
      # Queue service REST API
      CreateQueue: >-
        Creating a queue is the ordinary act and it holds no data at the moment it
        is made.
      PutMessage: >-
        A queue is a work list, so a message an attacker adds is work the consumer
        will do. That is real and it is not separable here: adding messages IS the
        application's normal write path, at whatever rate the application runs,
        and the operation name carries nothing about the content. A detection for
        a poisoned queue belongs in the consumer, not in this table.
      SetQueueMetadata: >-
        Arbitrary key-value pairs attached to a queue. They are not read by the
        service and change no access.
      GetQueueServiceProperties: >-
        Reads the logging configuration rather than changing it. The write, which
        is how logging is turned off, is mapped under T1562.008.
      UpdateMessage: >-
        The same judgment as PutMessage above. Extending a visibility timeout also
        hides a message from other readers, which is a delay rather than a loss.
      QueuePreflightRequest: >-
        A browser asking whether a cross-origin request is allowed. Issued by the
        browser, not by the caller, and it carries no identity.
  StorageTableLogs:
    platform: IaaS
    plane: data
    # Every operation Microsoft publishes for this table, mapped or rejected.
    techniques:
      - id: T1530
        operations:
          - QueryEntity
          - QueryEntities
        basis: >-
          Rows leaving. QueryEntities is the bulk read and the exfiltration signal
          for table storage; QueryEntity fetches a single row by key.

          Worth a rate rather than a single-event rule, because a query per row is
          what a normal application does.
      - id: T1619
        operations:
          - QueryTable
          - QueryTables
        basis: >-
          Finding out what tables exist before reading them.
      - id: T1562.008
        operations:
          - SetTableServiceProperties
        basis: >-
          Storage Analytics logging for the Table service is configured through the
          service properties, and this operation is the write that turns it off.
      - id: T1485
        operations:
          - DeleteTable
          - DeleteEntity
        basis: >-
          Rows gone. DeleteTable takes every row with it.
      - id: T1486
        operations:
          - EntityGroupTransaction
          - InsertOrMergeEntity
          - InsertOrReplaceEntity
          - UpdateEntity
          - MergeEntity
        basis: >-
          Overwriting rows in place. InsertOrReplaceEntity replaces a row wholesale,
          UpdateEntity and MergeEntity rewrite an existing one, and
          EntityGroupTransaction applies up to a hundred writes atomically, which is
          the fast way to rewrite a whole table.

          InsertEntity is deliberately NOT here: it fails if the row already exists,
          so it can add data but never destroy it. That is the line drawn across
          this table, and it is why the queue's writes are rejected while these are
          mapped -- a table row is stored data, a queue message is work in transit.
    rejected:
      # Table service REST API
      CreateTable: >-
        Creating a table is the ordinary act and it holds no rows at the moment it
        is made.
      InsertEntity: >-
        Adds a row and cannot replace one, so it destroys nothing. The operations
        that overwrite existing rows are mapped under T1486.
      GetTableServiceProperties: >-
        Reads the logging configuration rather than changing it. The write, which
        is how logging is turned off, is mapped under T1562.008.
      TablePreflightRequest: >-
        A browser asking whether a cross-origin request is allowed. Issued by the
        browser, not by the caller, and it carries no identity.
  # ── Databases ───────────────────────────────────────────────────────────────
  AuditLogs:
    platform: Identity Provider
    plane: identity
    note: >-
      Entra directory audit. OperationName values are English phrases, and the
      case Microsoft DOCUMENTS is not always the case a tenant WRITES -- measured:
      the reference says "Delete Conditional Access policy" and the tenant logged
      "Delete conditional access policy". Match with =~, never ==.
    # Every one of the 1,171 activities Microsoft publishes for this table is
    # either mapped to a technique below or rejected under a named rule. There is
    # no third pile, so an activity that appears in neither is a harvesting fault
    # rather than a judgment nobody wrote down.
    #
    # 922 distinct names: 460 mapped, 462 rejected.
    #
    # The rejections cite a RULE rather than carrying a sentence each. That is
    # deliberate. Nine hundred individual restatements of an operation name would
    # be unreadable and would hide the thing worth arguing with, which is the
    # rule. Disagree with one line under `rejection_rules` and everything citing
    # it falls with it.
    techniques:
      - id: T1136.003
