          A credential added to something that already exists, which is how access
          survives a password reset. A service principal credential is the sharpest:
          it is a secret or certificate on an application that may hold tenant-wide
          Graph permissions, it is added through an ordinary write, and nothing
          about the act looks like an authentication.

          The rest are the user-side equivalents -- a Windows Hello credential, a
          passwordless phone sign-in, a device-bound passkey, a hardware OATH token
