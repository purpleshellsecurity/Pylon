        MICROSOFT.WEB/SITES/HOST/SYNC/ACTION: >-
          The host-scoped spelling of the trigger sync above.
        MICROSOFT.WEB/SITES/HOST/SYSTEMKEYS/DELETE: >-
          Revokes a host system key.
        MICROSOFT.WEB/SITES/HOSTNAMEBINDINGS/DELETE: >-
          Removes a hostname binding, which makes the app stop answering to that
