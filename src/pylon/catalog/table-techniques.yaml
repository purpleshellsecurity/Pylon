        basis: >-
          Consent. A user or an administrator agrees that an application may act on
          their behalf, and from then on the application holds the access without
          the user being present. Tenant-wide admin consent is the version that
          matters most, and Entra writes it through the same activity as any other.

          The permission-grant operations are the mechanism underneath, and the
          permission grant POLICY is the setting that decides whether ordinary users
