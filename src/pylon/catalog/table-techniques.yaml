        basis: >-
          Credential material read out of the directory itself. A BitLocker recovery
          key unlocks a disk; a Windows LAPS password is the local administrator
          account on a machine. Both are stored in Entra so that a help desk can
          retrieve them, and both are a read away from anyone who holds the role
          that permits it.

          Rare, high value, and easy to lose in the volume of ordinary reads --
          which is why they are named individually here and why the R-read rule
          explicitly excludes them.
