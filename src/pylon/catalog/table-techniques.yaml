        basis: >-
          Changing what an existing principal can reach, without granting it a
          directory role and without giving it a new credential. The largest block
          on this table and the least specific, which is stated rather than hidden.

          Group membership is why. Access in Entra is mostly delegated to groups, so
          adding a member to the right group is a privilege grant that names no
          privilege -- and it is also what every joiner process does all day.
          Ownership is the same shape: an owner of an application can add
          credentials to it, so becoming an owner is one step away from becoming the
          application.

          Access packages belong here too. A package bundles groups, applications
          and sites behind a single request, and its assignment POLICY decides who
          may ask and whether anyone approves. Setting that policy to auto-approve
          turns a request into a grant.
