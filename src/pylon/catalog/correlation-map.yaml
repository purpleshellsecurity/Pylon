# Cross-log correlation map — how to follow one actor across log surfaces.
#
# Per-table metadata for actor-correlated pivoting (see
# docs/correlation-pivot-layer-spec.md). Hand-curated from the table assets
# (prompts/assets/tables/*.md); small, stable, one entry per table.
#
# Schema per table:
#   plane:    identity | control | data      (drives kill-chain ordering)
#   role:     detection | context            (context = pivot target, never a rule)
#   actor:    ordered list of {field, kind[, json_path, array]}
#               order = join preference; object ID (oid) is the canonical key.
#               json_path -> field is DYNAMIC; index into it directly
#               (tostring(Field.a.b)), never through parse_json().
#               array: true -> field is a dynamic array (use `has`, not `==`).
#   ip:       {field[, json_path, array]}  or null   (casing is authoritative)
#   resource: {field, kind}  or null        (scopes the same-resource pivot tier)
#
# kind values: oid | upn | appid | spn | upn_or_oid | sql_login | k8s_user
#   Only same-kind actor fields join directly; the alert supplies the value(s).

tables:
  # ── Identity plane ──────────────────────────────────────────────────────────
  SigninLogs:
    plane: identity
    role: detection
    actor:
      - {field: UserId, kind: oid}
      - {field: UserPrincipalName, kind: upn}
    ip: {field: IPAddress}
    resource: null

  AuditLogs:
    plane: identity           # Entra directory changes
    role: detection
    actor:
      - {field: InitiatedBy, kind: oid,   json_path: user.id}
      - {field: InitiatedBy, kind: upn,   json_path: user.userPrincipalName}
      - {field: InitiatedBy, kind: appid, json_path: app.appId}
    ip: {field: InitiatedBy, json_path: user.ipAddress}
    resource: null

  # ── Control plane ───────────────────────────────────────────────────────────
  AzureActivity:
    plane: control
    role: detection
    actor:
      - {field: Caller, kind: upn_or_oid}   # UPN for users, object ID for SPs
    ip: {field: CallerIpAddress}            # lowercase p
    resource: {field: ResourceId, kind: arm_id}

  # ── Data plane ──────────────────────────────────────────────────────────────
  AZKVAuditLogs:
    plane: data
    role: detection
    actor:
      - {field: Identity, kind: oid,   json_path: claim.oid}
      - {field: Identity, kind: upn,   json_path: claim.upn}
      - {field: Identity, kind: appid, json_path: claim.appid}
    # CallerIpAddress — lowercase p. AzureDiagnostics spells it CallerIPAddress
    # and this dedicated table does not; the previous entry carried the
    # AzureDiagnostics spelling plus a comment telling the next reader not to
    # "normalize" it, which is why it survived the schema audit.
    ip: {field: CallerIpAddress}
    resource: {field: _ResourceId, kind: arm_id}

  StorageBlobLogs:
    plane: data
    role: detection
    actor:
      - {field: RequesterObjectId, kind: oid}
      - {field: RequesterUpn, kind: upn}
      - {field: RequesterAppId, kind: appid}
    ip: {field: CallerIpAddress}            # lowercase p
    resource: {field: AccountName, kind: name}

  # The other three storage services. Same identity columns as blob -- measured
  # against each table's schema asset, not assumed from the family name -- and
  # they were missing, so a queue/file/table detection's playbook fell back to
  # prose and got no grounded pivot at all. A map that lists tables no target can
  # fire on while omitting three that can is drift in both directions at once.
  StorageFileLogs:
    plane: data
    role: detection
    actor:
      - {field: RequesterObjectId, kind: oid}
      - {field: RequesterUpn, kind: upn}
      - {field: RequesterAppId, kind: appid}
    ip: {field: CallerIpAddress}            # lowercase p
    resource: {field: AccountName, kind: name}

  StorageQueueLogs:
    plane: data
    role: detection
    actor:
      - {field: RequesterObjectId, kind: oid}
      - {field: RequesterUpn, kind: upn}
      - {field: RequesterAppId, kind: appid}
    ip: {field: CallerIpAddress}
    resource: {field: AccountName, kind: name}

  StorageTableLogs:
    plane: data
    role: detection
    actor:
      - {field: RequesterObjectId, kind: oid}
      - {field: RequesterUpn, kind: upn}
      - {field: RequesterAppId, kind: appid}
    ip: {field: CallerIpAddress}
    resource: {field: AccountName, kind: name}

  # Measured from real rows today. UserDisplayName carried the UPN on every row;
  # `User` is an opaque publishing-credential id like "100320049CB7E7B3" and is
  # useful for correlation, never for naming a person.
  AppServiceAuditLogs:
    plane: data
    role: detection
    actor:
      - field: UserDisplayName
        kind: upn
      - field: User
        kind: opaque
    ip:
      field: UserAddress
    resource:
      field: _ResourceId
      kind: arm_id

  # NO actor. The front door decides before any identity is established, so
  # there is nobody to pivot to -- only an address. CIp carries the ephemeral
  # PORT, so it must be split before it can be compared to an address anywhere
  # else; joining on the raw value never matches.
  AppServiceIPSecAuditLogs:
    plane: data
    role: detection
    actor: []
    no_actor_reason: >-
      An access-restriction decision is made before authentication, so the row
      names no principal. Pivot on the address instead.
    ip:
      field: CIp
      extract: tostring(split(CIp, ":")[0])
    resource:
      field: _ResourceId
      kind: arm_id

  # NO actor and NO address. A host or invocation log records what the runtime
  # did, not who asked. HostInstanceId is the only correlation handle: it groups
  # the lines from one host lifetime.
  FunctionAppLogs:
    plane: data
    role: detection
    actor: []
    no_actor_reason: >-
      Neither a host lifecycle line nor an invocation line carries a caller.
      The app's own logging calls do not either.
    correlate:
      field: HostInstanceId
    resource:
      field: _ResourceId
      kind: arm_id

  MicrosoftGraphActivityLogs:
    plane: data
    role: detection
    actor:
      - {field: UserId, kind: oid}              # delegated auth
      - {field: ServicePrincipalId, kind: oid}  # app-only auth
      - {field: AppId, kind: appid}
    ip: {field: IPAddress}
    resource: null

  # ── AzureDiagnostics, one entry per provider and category ──────────────────
  #
  # The shared table. One filter on its name returns every service in the tenant
  # that writes here, and "which column holds the caller" has a different answer
  # in each -- so a single AzureDiagnostics entry would be wrong for at least two
  # of the three below. Keyed by the composite the engine already resolves
  # (provider + category); `table` is what the query actually reads and `scope`
  # is the predicate that narrows it to one service.
  #
  # Measured in the lab workspace over 90 days: 50 SQL audit rows, 15 Automation
  # audit events, 9 job logs, 12 job streams.
  AzureDiagnostics/MICROSOFT.AUTOMATION/AuditEvent:
    table: AzureDiagnostics
    scope: ResourceProvider == "MICROSOFT.AUTOMATION" and Category == "AuditEvent"
    plane: control
    role: detection
    actor:
      - field: clientInfo_ObjectId_g
        kind: oid
    # No ip entry ON PURPOSE. clientInfo_IpAddress_s exists and holds the literal
    # "{scrubbed}" on every row measured, so an IP pivot here would run, return
    # rows, and match on a placeholder. Absent beats present-and-wrong.
    resource:
      field: _ResourceId
      kind: arm_id

  AzureDiagnostics/MICROSOFT.AUTOMATION/JobLogs:
    table: AzureDiagnostics
    scope: ResourceProvider == "MICROSOFT.AUTOMATION" and Category == "JobLogs"
    plane: control
    role: detection
    actor:
      - field: Caller_s
        kind: upn
    resource:
      field: _ResourceId
      kind: arm_id

  AzureDiagnostics/MICROSOFT.AUTOMATION/JobStreams:
    table: AzureDiagnostics
    scope: ResourceProvider == "MICROSOFT.AUTOMATION" and Category == "JobStreams"
    plane: control
    role: detection
    actor: []
    # A stream is the OUTPUT of a runbook, so the row names no caller. The job it
    # belongs to does: join to JobLogs on JobId_g. Recorded here because the
    # pivot generator's actor-less branch is the honest answer for this one.
    no_actor_reason: >-
      A job stream is runbook output and names nobody. The caller is on the
      JobLogs row for the same JobId_g.
    resource:
      field: _ResourceId
      kind: arm_id

  AzureDiagnostics/MICROSOFT.SQL/SQLSecurityAuditEvents:
    table: AzureDiagnostics
    scope: ResourceProvider == "MICROSOFT.SQL" and Category == "SQLSecurityAuditEvents"
    plane: data
    role: detection
    actor:
      - field: server_principal_name_s
        kind: upn
    # MEASURED, and the reason this entry says `upn` rather than a generic
    # principal: server_principal_name_s holds THREE shapes in 50 rows. 47 carry
    # an Entra UPN, 2 carry "sa" and 1 carries "NT AUTHORITY\\SYSTEM", both on
    # AUDIT SESSION CHANGED. The last two are SQL-local and exist nowhere in the
    # directory, so an identity pivot on them is valid KQL that returns zero rows
    # forever -- the AzureActivity.Caller failure, in a column that looks safer.
    principal_caveat: >-
      A SQL principal is not necessarily a directory principal. Rows carrying
      "sa" or an NT AUTHORITY name are server-local and will not join to
      SigninLogs; check is_server_level_principal_s before pivoting on identity.
    ip:
      field: client_ip_s
    resource:
      field: _ResourceId
      kind: arm_id

  # The web-shell table. Names the FILE and never the person: nine columns and
  # not one identity, measured. So it starts no actor pivot -- the responder's
  # first hop is the publishing logon that preceded the write, which lives in
  # AppServiceAuditLogs over the same window and the same _ResourceId.
  AppServiceFileAuditLogs:
    plane: data
    role: detection
    actor: []
    no_actor_reason: >-
      A file-change row records the path, the operation and the writing process
      and names nobody. Join AppServiceAuditLogs on _ResourceId and time for the
      publishing logon -- and read that table's attribution gate, because a Kudu
      or FTP publish names the site credential rather than a person.
    resource:
      field: _ResourceId
      kind: arm_id
